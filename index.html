<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eldoria Rank & Glyph Mapper</title>
    <style>
        body {
            background-color: #2c2f33;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1, h3 { margin-top: 0; margin-bottom: 10px; text-align: center; }
        .panel {
            background: #23272a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 2px solid #7289da;
        }
        .panel-gold { border-color: #faa61a; }
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 10px;
        }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        input[type="number"], input[type="file"], select {
            padding: 7px;
            border: 1px solid #7289da;
            border-radius: 4px;
            background: #2c2f33;
            color: white;
            font-weight: bold;
        }
        button {
            background-color: #7289da;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background-color: #5b6eae; }
        .btn-download { background-color: #43b581; font-size: 14px; padding: 8px 15px; }
        .btn-download:hover { background-color: #3ca374; }

        /* Canvas Kecil untuk Bikin Badge */
        .canvas-mini {
            background: #111;
            border: 1px solid #43b581;
            margin: 10px auto;
            display: block;
            image-rendering: pixelated;
        }

        /* Canvas Besar untuk Preview 960x960 */
        .canvas-sprite-container {
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1 / 1;
            border: 2px dashed #faa61a;
            border-radius: 4px;
            overflow: hidden;
            background: #111;
            position: relative;
        }
        #spriteCanvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .output-box {
            width: 100%;
            background: #2c2f33;
            color: #43b581;
            border: 1px solid #7289da;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
            margin-top: 10px;
            box-sizing: border-box;
            resize: none;
        }
    </style>
</head>
<body>

    <h1>✨ Eldoria Glyph Mapper</h1>

    <!-- PANEL 1: GENERATOR BADGE -->
    <div class="panel">
        <h3>🛡️ 1. Buat Rank Badge</h3>
        <div class="controls">
            <div class="control-group">
                <label>Pilih Rank:</label>
                <select id="rankSelect" onchange="generateRankBadge()">
                    <option value="NOVARIA">NOVARIA</option>
                    <option value="IRONVEIL">IRONVEIL</option>
                    <option value="SILVERLIGHT">SILVERLIGHT</option>
                    <option value="GOLDHAVEN">GOLDHAVEN</option>
                    <option value="PLATINEX">PLATINEX</option>
                    <option value="CRYSTALON">CRYSTALON</option>
                    <option value="MYTHORIA">MYTHORIA</option>
                    <option value="ETERNALIS">ETERNALIS</option>
                    <option value="CELESTORA">CELESTORA</option>
                    <option value="DIVINEXUS">DIVINEXUS</option>
                    <option value="ADMIN">ADMIN</option>
                    <option value="OWNER">OWNER</option>
                </select>
            </div>
            <div class="control-group">
                <label>Lebar Badge (px)</label>
                <input type="number" id="badgeW" value="83" onchange="generateRankBadge()">
            </div>
            <div class="control-group">
                <label>Tinggi Badge (px)</label>
                <input type="number" id="badgeH" value="83" onchange="generateRankBadge()">
            </div>
        </div>
        
        <canvas id="pixelCanvas" class="canvas-mini" width="83" height="83"></canvas>
        
        <div style="text-align: center;">
            <button class="btn-download" onclick="downloadImage()">⬇️ Download Hanya Badge PNG</button>
        </div>
    </div>

    <!-- PANEL 2: GLYPH MAPPER 960x960 -->
    <div class="panel panel-gold">
        <h3 style="color: #faa61a;">🗺️ 2. Cocokkan ke Glyph Master (960x960)</h3>
        <div class="controls">
            <div class="control-group" style="width: 100%;">
                <label>Upload Gambar Glyph Kamu (misal 960x960):</label>
                <input type="file" id="uploadGlyph" accept="image/png, image/jpeg">
            </div>
        </div>
        
        <div class="controls" style="margin-top: 10px;">
            <div class="control-group">
                <label>Geser Kiri/Kanan (X)</label>
                <input type="number" id="posX" value="0" step="1" oninput="updateSpritePreview()">
            </div>
            <div class="control-group">
                <label>Geser Atas/Bawah (Y)</label>
                <input type="number" id="posY" value="0" step="1" oninput="updateSpritePreview()">
            </div>
            <div class="control-group" style="justify-content: flex-end;">
                <button onclick="centerBadge()">Taruh Tengah</button>
            </div>
        </div>

        <div class="canvas-sprite-container">
            <canvas id="spriteCanvas" width="960" height="960"></canvas>
        </div>

        <h4 style="margin-bottom: 5px;">Kirim Data Ini ke AI:</h4>
        <textarea id="outputData" class="output-box" rows="3" readonly></textarea>
    </div>

    <script>
        const canvas = document.getElementById('pixelCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        const spriteCanvas = document.getElementById('spriteCanvas');
        const sCtx = spriteCanvas.getContext('2d');
        sCtx.imageSmoothingEnabled = false;

        let templateImage = null; // Menyimpan gambar 960x960 yang diupload

        const rankData = {
            "NOVARIA":     { c1: "#BFC9CA", c2: "#7F8C8D", icon: "leaf" },
            "IRONVEIL":    { c1: "#D5DBDB", c2: "#839192", icon: "sword" },
            "SILVERLIGHT": { c1: "#FDFEFE", c2: "#BDC3C7", icon: "shield" },
            "GOLDHAVEN":   { c1: "#F1C40F", c2: "#B9770E", icon: "coin" },
            "PLATINEX":    { c1: "#48C9B0", c2: "#117A65", icon: "gem" },
            "CRYSTALON":   { c1: "#D2B4DE", c2: "#8E44AD", icon: "crystal" },
            "MYTHORIA":    { c1: "#F1948A", c2: "#C0392B", icon: "youtube" },
            "ETERNALIS":   { c1: "#E67E22", c2: "#A04000", icon: "flame" },
            "CELESTORA":   { c1: "#85C1E9", c2: "#2874A6", icon: "star" },
            "DIVINEXUS":   { c1: "#F8C471", c2: "#D68910", icon: "sun" },
            "ADMIN":       { c1: "#E74C3C", c2: "#7B241C", icon: "skull" },
            "OWNER":       { c1: "#F7DC6F", c2: "#17202A", icon: "crown" }
        };

        const icons = {
            crown: ["1000001","1100011","1010101","1111111","1111111"],
            skull: ["011110","111111","101101","111111","010010"],
            youtube: ["0111110","1111111","1110111","1111011","1110111","1111111","0111110"],
            sword: ["00001","00011","01110","11100","01000"],
            shield: ["111111","100001","100001","010010","001100"],
            gem: ["011110","111111","011110","001100"],
            crystal: ["00100","01110","11111","01110","00100"],
            flame: ["00100","01100","11110","11111","01110"],
            star: ["00100","01110","11111","01110","10001"],
            sun: ["10101","01110","11111","01110","10101"],
            coin: ["01110","11111","11011","11111","01110"],
            leaf: ["0010","0110","1111","0110","0010"]
        };

        function generateRankBadge() {
            const w = parseInt(document.getElementById('badgeW').value) || 83;
            const h = parseInt(document.getElementById('badgeH').value) || 83;
            canvas.width = w;
            canvas.height = h;
            
            ctx.clearRect(0, 0, w, h);
            
            const rankName = document.getElementById('rankSelect').value;
            const data = rankData[rankName];

            const pSize = 2; // Ketebalan pixel
            const badgeW = 38 * pSize; 
            const badgeH = 10 * pSize; 

            const offsetX = Math.floor((w - badgeW) / 2); 
            const offsetY = Math.floor((h - badgeH) / 2);

            // BORDER
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(offsetX, offsetY, 10 * pSize, badgeH); 
            ctx.fillRect(offsetX + 11 * pSize, offsetY, 27 * pSize, badgeH); 

            // WARNA DALAM
            ctx.fillStyle = data.c1; 
            ctx.fillRect(offsetX + 1*pSize, offsetY + 1*pSize, 8*pSize, 4*pSize);
            ctx.fillStyle = data.c2; 
            ctx.fillRect(offsetX + 1*pSize, offsetY + 5*pSize, 8*pSize, 4*pSize);

            ctx.fillStyle = data.c1;
            ctx.fillRect(offsetX + 12*pSize, offsetY + 1*pSize, 25*pSize, 4*pSize);
            ctx.fillStyle = data.c2;
            ctx.fillRect(offsetX + 12*pSize, offsetY + 5*pSize, 25*pSize, 4*pSize);

            // ICON
            const iconMatrix = icons[data.icon];
            if(iconMatrix) {
                const iW = iconMatrix[0].length;
                const iH = iconMatrix.length;
                const oX = offsetX + Math.floor((10 - iW) / 2) * pSize; 
                const oY = offsetY + Math.floor((10 - iH) / 2) * pSize;

                for(let r = 0; r < iH; r++) {
                    for(let c = 0; c < iW; c++) {
                        if(iconMatrix[r][c] === '1') {
                            ctx.fillStyle = "#111111";
                            ctx.fillRect(oX + (c * pSize) + pSize, oY + (r * pSize) + pSize, pSize, pSize);
                            ctx.fillStyle = "#ffffff";
                            ctx.fillRect(oX + (c * pSize), oY + (r * pSize), pSize, pSize);
                        }
                    }
                }
            }

            // TEKS
            ctx.font = "bold 13px 'Segoe UI', Arial, sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            const textX = offsetX + (11 * pSize) + Math.floor((27 * pSize) / 2);
            const textY = offsetY + Math.floor((10 * pSize) / 2);

            ctx.fillStyle = "#111111"; 
            ctx.fillText(rankName, textX + 1.5, textY + 1.5, 25 * pSize);
            ctx.fillStyle = "#ffffff";
            ctx.fillText(rankName, textX, textY, 25 * pSize);

            // Selalu update preview di kanvas besar jika rank diubah
            updateSpritePreview();
        }

        // --- SISTEM UPLOAD GLYPH MASTER ---
        document.getElementById('uploadGlyph').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    templateImage = img;
                    spriteCanvas.width = img.width; 
                    spriteCanvas.height = img.height;
                    updateSpritePreview();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        function centerBadge() {
            if(!templateImage) return;
            document.getElementById('posX').value = Math.floor(spriteCanvas.width / 2) - Math.floor(canvas.width / 2);
            document.getElementById('posY').value = Math.floor(spriteCanvas.height / 2) - Math.floor(canvas.height / 2);
            updateSpritePreview();
        }

        function updateSpritePreview() {
            if(!templateImage) {
                // Gambar background default jika belum upload
                sCtx.fillStyle = "#222";
                sCtx.fillRect(0, 0, spriteCanvas.width, spriteCanvas.height);
                sCtx.fillStyle = "#444";
                sCtx.font = "20px Arial";
                sCtx.textAlign = "center";
                sCtx.fillText("Belum ada gambar Glyph yang diupload", spriteCanvas.width/2, spriteCanvas.height/2);
            } else {
                sCtx.clearRect(0, 0, spriteCanvas.width, spriteCanvas.height);
                // 1. Gambar Template Master (Misal 960x960)
                sCtx.drawImage(templateImage, 0, 0);
            }

            // 2. Tumpuk Gambar Badge di Koordinat X, Y
            const x = parseInt(document.getElementById('posX').value) || 0;
            const y = parseInt(document.getElementById('posY').value) || 0;
            const w = canvas.width;
            const h = canvas.height;
            const rankName = document.getElementById('rankSelect').value;

            // Gambar Badge-nya
            sCtx.drawImage(canvas, x, y);

            // Bikin kotak merah tipis buat menandai batas (biar gampang ngepasinnya)
            sCtx.strokeStyle = "rgba(255, 0, 0, 0.8)";
            sCtx.lineWidth = 1;
            sCtx.strokeRect(x, y, w, h);

            // Update Text Data untuk AI
            const outputText = `RANK: ${rankName}\nUKURAN GLYPH MASTER: ${spriteCanvas.width}x${spriteCanvas.height}\nKOORDINAT BADGE -> [ X: ${x}, Y: ${y}, W: ${w}, H: ${h} ]`;
            document.getElementById('outputData').value = outputText;
        }

        function downloadImage() {
            const link = document.createElement('a');
            const rankName = document.getElementById('rankSelect').value;
            link.download = `badge_${rankName.toLowerCase()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        window.onload = () => { 
            generateRankBadge(); 
            updateSpritePreview();
        };
    </script>
</body>
</html>
