<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eldoria Rank Inspector | CSS Extractor</title>
    <style>
        :root { 
            --primary: #7289da; 
            --gold: #faa61a; 
            --success: #43b581; 
            --bg: #2c2f33; 
            --panel: #23272a; 
        }
        
        body { 
            background-color: var(--bg); 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            margin: 0; 
        }

        .main-container { 
            background: var(--panel); 
            padding: 25px; 
            border-radius: 12px; 
            border: 2px solid var(--primary); 
            width: 95%; 
            max-width: 1200px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }

        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { color: var(--gold); margin: 0; }

        .toolbar { 
            background: #1e2124; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 20px; 
            align-items: center; 
            justify-content: center;
            border: 1px solid #444;
        }

        .workspace { display: flex; gap: 20px; flex-wrap: wrap; }

        /* Viewer Gambar Asli */
        .image-viewer { 
            flex: 2; 
            min-width: 450px; 
            position: relative; 
            overflow: auto; 
            background: #000; 
            border: 2px solid #444; 
            max-height: 700px; 
            border-radius: 8px; 
        }
        #glyphCanvas { cursor: crosshair; image-rendering: pixelated; display: block; }

        /* Sidebar Hasil */
        .sidebar { 
            flex: 1; 
            min-width: 320px; 
            background: #1e2124; 
            padding: 20px; 
            border-radius: 8px; 
            border: 1px solid var(--primary); 
        }

        .preview-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .preview-box { 
            width: 83px; 
            height: 83px; 
            background: #111; 
            border: 1px dashed var(--success); 
            margin: 10px auto; 
            overflow: hidden; 
            position: relative; 
        }
        
        #cssArtResult { width: 1px; height: 1px; position: absolute; top: 0; left: 0; }

        label { font-size: 13px; color: #aaa; margin-bottom: 5px; display: block; }
        input[type="number"], textarea { 
            width: 100%; 
            padding: 10px; 
            margin-bottom: 15px; 
            border-radius: 4px; 
            border: 1px solid #444; 
            background: var(--bg); 
            color: white; 
            font-family: monospace; 
            box-sizing: border-box; 
        }

        .btn-main { 
            width: 100%; 
            padding: 14px; 
            background: var(--success); 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 15px; 
            transition: 0.3s; 
        }
        .btn-main:hover { background: #3ca374; transform: scale(1.02); }

        .coord-info { 
            background: #000; 
            padding: 12px; 
            border-radius: 4px; 
            border-left: 4px solid var(--gold); 
            color: var(--gold); 
            font-family: monospace; 
            margin-bottom: 15px; 
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <h2>🔍 Eldoria Glyph Inspector</h2>
            <p>Upload gambar Glyph kamu dan ekstrak rank menjadi kode CSS ringan.</p>
        </div>

        <div class="toolbar">
            <div style="flex: 1;">
                <label>1. Upload File (960x960 PNG):</label>
                <input type="file" id="fileInput" accept="image/png" style="color:white;">
            </div>
            <div>
                <label>Ukuran Box (W):</label>
                <input type="number" id="boxW" value="83" style="width: 70px; margin-bottom: 0;">
            </div>
            <div>
                <label>Ukuran Box (H):</label>
                <input type="number" id="boxH" value="83" style="width: 70px; margin-bottom: 0;">
            </div>
        </div>

        <div class="workspace">
            <div class="image-viewer">
                <canvas id="glyphCanvas"></canvas>
            </div>

            <div class="sidebar">
                <div class="preview-section">
                    <label>LIVE PREVIEW (83x83)</label>
                    <div class="preview-box">
                        <div id="cssArtResult"></div>
                    </div>
                </div>

                <div class="coord-info" id="statusInfo">Pilih koordinat pada gambar...</div>

                <button class="btn-main" onclick="processPixels()">✨ GENERATE KODE CSS</button>

                <label style="margin-top: 20px;">Copy Kode HTML/CSS ke Dashboard Adhost:</label>
                <textarea id="finalCode" rows="12" readonly placeholder="Kode akan muncul di sini..."></textarea>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const canvas = document.getElementById('glyphCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const cssArtResult = document.getElementById('cssArtResult');
        const finalCode = document.getElementById('finalCode');
        const statusInfo = document.getElementById('statusInfo');

        let originalImg = new Image();
        let curX = 0;
        let curY = 0;

        // 1. Loader Gambar
        fileInput.addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                originalImg.onload = () => {
                    canvas.width = originalImg.width;
                    canvas.height = originalImg.height;
                    refreshCanvas();
                };
                originalImg.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        // 2. Klik untuk memilih area
        canvas.addEventListener('mousedown', (e) => {
            if (!originalImg.src) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            curX = Math.floor((e.clientX - rect.left) * scaleX);
            curY = Math.floor((e.clientY - rect.top) * scaleY);

            const w = parseInt(document.getElementById('boxW').value);
            const h = parseInt(document.getElementById('boxH').value);

            statusInfo.innerText = `X: ${curX}, Y: ${curY} | Box: ${w}x${h}`;
            refreshCanvas();
        });

        function refreshCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(originalImg, 0, 0);
            
            const w = parseInt(document.getElementById('boxW').value);
            const h = parseInt(document.getElementById('boxH').value);
            
            // Draw Selector
            ctx.strokeStyle = "#ff0000";
            ctx.lineWidth = 2;
            ctx.strokeRect(curX, curY, w, h);
            ctx.fillStyle = "rgba(255, 0, 0, 0.2)";
            ctx.fillRect(curX, curY, w, h);
        }

        function rgbToHex(r, g, b) {
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }

        // 3. Ekstraksi Pixel ke Box-Shadow
        function processPixels() {
            if (!originalImg.src) return alert("Upload file glyph dulu!");
            
            const w = parseInt(document.getElementById('boxW').value);
            const h = parseInt(document.getElementById('boxH').value);
            
            const imgData = ctx.getImageData(curX, curY, w, h).data;
            let shadows = [];

            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    const r = imgData[i];
                    const g = imgData[i+1];
                    const b = imgData[i+2];
                    const a = imgData[i+3];

                    // Hanya ambil pixel yang solid (tidak transparan)
                    if (a > 30) {
                        const hex = rgbToHex(r, g, b);
                        shadows.push(`${x}px ${y}px ${hex}`);
                    }
                }
            }

            const className = `rank-eldoria-${Math.floor(Math.random()*1000)}`;
            const codeOutput = `<style>
.${className} {
    width: 1px;
    height: 1px;
    background: transparent;
    box-shadow: 
        ${shadows.join(',\n        ')};
    /* Scale ini agar pixel terlihat tajam di web */
    transform: scale(1.5);
    transform-origin: top left;
}
</style>

<div class="${className}"></div>`;

            finalCode.value = codeOutput;
            cssArtResult.style.boxShadow = shadows.join(',');
            alert("Berhasil mengekstrak " + shadows.length + " pixel!");
        }
    </script>
</body>
</html>
