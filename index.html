<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eldoria Glyph Studio v12</title>
    <style>
        :root {
            --bg-main: #0f1012; --bg-panel: #1e1f22; --primary: #5865F2;
            --success: #23a559; --warning: #f0b232; --danger: #da373c;
            --text-main: #dbdee1; --border: #2b2d31; --gold: #faa61a;
        }

        body {
            background-color: var(--bg-main); color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center;
        }

        h1 { color: #fff; margin: 10px 0; text-align: center; font-size: 1.4rem; letter-spacing: 1px; }

        .toolbar {
            background: var(--bg-panel); padding: 15px; border-radius: 12px;
            display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 15px; width: 100%; max-width: 1000px;
            box-sizing: border-box; border: 1px solid var(--border);
        }

        .tool-row { display: flex; gap: 10px; width: 100%; flex-wrap: wrap; }
        .input-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 100px; }
        label { font-size: 10px; color: #888; font-weight: bold; text-transform: uppercase; }
        
        input[type="file"], input[type="text"], input[type="number"], select {
            background: #111214; border: 1px solid #333; color: white;
            padding: 10px; border-radius: 6px; font-family: monospace; width: 100%; box-sizing: border-box;
            outline: none; font-size: 13px;
        }
        
        button {
            background: var(--primary); color: white; border: none; box-sizing: border-box;
            padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s;
            font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        button:active { transform: scale(0.95); }
        .btn-success { background: var(--success); }
        .btn-warning { background: var(--warning); color: black; }
        .btn-danger { background: var(--danger); }
        .btn-full { width: 100%; }

        .workspace { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 1000px; }
        @media (min-width: 850px) { .workspace { display: grid; grid-template-columns: 350px 1fr; } }

        .master-viewer {
            background: var(--bg-panel); padding: 15px; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; border: 1px solid var(--border);
        }
        
        .canvas-wrapper {
            width: 100%; max-width: 320px; aspect-ratio: 1/1; background: #000;
            overflow: hidden; border: 1px solid #000; border-radius: 4px; position: relative;
            background-image: linear-gradient(45deg, #161719 25%, transparent 25%), linear-gradient(-45deg, #161719 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #161719 75%), linear-gradient(-45deg, transparent 75%, #161719 75%);
            background-size: 20px 20px;
        }
        
        #masterCanvas, #editCanvas { width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; }

        .glyph-gallery {
            background: var(--bg-panel); padding: 15px; border-radius: 12px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px; max-height: 80vh; overflow-y: auto; align-content: start; border: 1px solid var(--border);
        }

        .glyph-card {
            background: #111214; border: 1px solid #222; border-radius: 8px;
            padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        
        .glyph-img {
            width: 70px; height: 70px; background: #000; image-rendering: pixelated;
            border: 1px dashed #444; background-size: 10px 10px;
        }

        .hex-code { font-family: monospace; font-size: 12px; color: var(--gold); }
        .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; width: 100%; }

        /* MODAL EDITOR MOBILE OPTIMIZED */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal {
            background: var(--bg-panel); border-radius: 12px; width: 95%; max-width: 450px;
            max-height: 95vh; overflow-y: auto; border: 2px solid var(--primary); display: flex; flex-direction: column;
            position: relative;
        }
        
        .modal-header { 
            padding: 12px 15px; border-bottom: 1px solid #333; display: flex; 
            justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--bg-panel); z-index: 10; 
        }

        .sticky-canvas-area {
            position: sticky; top: 0; z-index: 20; background: var(--bg-panel);
            padding: 15px; border-bottom: 1px solid #333; box-shadow: 0 5px 10px rgba(0,0,0,0.4);
        }

        .editor-canvas-wrap {
            width: 100%; max-width: 200px; aspect-ratio: 1/1; border: 2px solid #000; margin: 0 auto;
            background-image: linear-gradient(45deg, #111 25%, transparent 25%), linear-gradient(-45deg, #111 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #111 75%), linear-gradient(-45deg, transparent 75%, #111 75%);
            background-size: 20px 20px; cursor: crosshair; border-radius: 4px; overflow: hidden;
        }

        .modal-body { padding: 15px; display: flex; flex-direction: column; gap: 12px; }

        .tool-box { background: #111214; padding: 15px; border-radius: 10px; border: 1px solid #333; }
        .tool-box h4 { margin: 0 0 10px 0; font-size: 11px; color: var(--gold); text-transform: uppercase; border-bottom: 1px dashed #333; padding-bottom: 5px; }
        
        /* VISUAL PICKERS (CARD MENU) */
        .visual-picker { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        
        .color-box {
            width: 30px; height: 30px; border-radius: 6px; cursor: pointer;
            border: 2px solid #333; transition: 0.2s; box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }
        .color-box:hover { transform: scale(1.1); }
        .color-box.active { border-color: var(--gold); transform: scale(1.15); box-shadow: 0 0 8px var(--gold); }

        .icon-box {
            width: 32px; height: 32px; border-radius: 6px; cursor: pointer;
            background: #1e1f22; border: 2px solid #333; display: flex;
            justify-content: center; align-items: center; font-size: 16px; transition: 0.2s;
        }
        .icon-box:hover { background: #333; }
        .icon-box.active { border-color: var(--gold); background: #333; box-shadow: 0 0 8px var(--gold); }

        .slider-group { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .slider-group label { width: 50px; color: #fff; font-size: 11px; }
        input[type="range"] { flex: 1; accent-color: var(--success); }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
    </style>
</head>
<body>

    <h1>✨ ELDORIA STUDIO V12</h1>

    <div class="toolbar">
        <div class="tool-row">
            <div class="input-group" style="flex: 2;">
                <label>File Spritesheet (PNG)</label>
                <input type="file" id="uploadFile">
            </div>
            <!-- TOMBOL BIKIN KANVAS KOSONG (960x960) -->
            <button class="btn-warning" onclick="createEmptyCanvas()" style="margin-top: 15px;">✨ KANVAS KOSONG</button>
        </div>
        <div class="tool-row">
            <!-- DEFAULT GRID 16x16 -->
            <div class="input-group"><label>X Grid</label><input type="number" id="gridCols" value="16"></div>
            <div class="input-group"><label>Y Grid</label><input type="number" id="gridRows" value="16"></div>
            <div class="input-group"><label>Hex Awal</label><input type="text" id="baseHex" value="E100"></div>
            <button class="btn-success" onclick="processGlyphs()" style="margin-top: 15px;">⚙️ PISAHKAN</button>
        </div>
    </div>

    <div class="workspace">
        <div class="master-viewer">
            <div class="canvas-wrapper"><canvas id="masterCanvas"></canvas></div>
            <button class="btn-success btn-full" style="margin-top: 15px;" onclick="downloadMaster()">⬇️ EXPORT MASTER 960x960</button>
        </div>
        <div class="glyph-gallery" id="galleryContainer"></div>
    </div>

    <!-- EDITOR MODAL OPTIMIZED FOR MOBILE UX -->
    <div class="modal-overlay" id="editorModal">
        <div class="modal">
            <div class="modal-header">
                <span id="editTitle" style="font-weight:bold; color:var(--gold);">EDIT GLYPH</span>
                <button class="btn-danger" onclick="closeEditor()" style="padding: 5px 10px; font-size: 11px;">TUTUP</button>
            </div>
            
            <!-- STICKY CANVAS: MELAYANG DI ATAS PAS DI SCROLL DI HP! -->
            <div class="sticky-canvas-area">
                <div class="editor-canvas-wrap">
                    <canvas id="editCanvas"></canvas>
                </div>
            </div>

            <div class="modal-body">
                
                <!-- 1. TEMPLATE VISUAL (CARD MENU) -->
                <div class="tool-box">
                    <h4 style="color:#faa61a;">🛡️ 1. Desain Base & Icon (9 Pilihan)</h4>
                    
                    <label style="display:block; margin-bottom:5px;">Warna Rank:</label>
                    <div class="visual-picker" id="colorPicker"></div>

                    <label style="display:block; margin-bottom:5px; margin-top:10px;">Logo Icon:</label>
                    <div class="visual-picker" id="iconPicker"></div>

                    <div style="display:flex; align-items:center; gap:10px; margin-top:15px;">
                        <input type="color" id="iconColor" value="#ffffff" style="flex:1; padding:0; height: 35px; cursor: pointer;" title="Warna Icon">
                        <label style="display:flex; align-items:center; gap:5px; color:#fff; cursor:pointer; flex:2;">
                            <input type="checkbox" id="iconGradient" checked> Gradasi Icon
                        </label>
                        <button class="btn-warning" style="flex:2;" onclick="applyTemplate()">TERAPKAN</button>
                    </div>
                </div>

                <!-- 2. KONTROL TEKS & POSISI -->
                <div class="tool-box" style="border-color: var(--success);">
                    <h4 style="color:#23a559;">🔤 2. Cetak Teks</h4>
                    <input type="text" id="customText" placeholder="Ketik teks (Cth: MOD)" oninput="previewEditor()" style="margin-bottom: 10px;">
                    
                    <div class="slider-group">
                        <label>POS X</label>
                        <input type="range" id="textX" min="-5" max="60" value="23" oninput="previewEditor()">
                    </div>
                    <div class="slider-group">
                        <label>POS Y</label>
                        <input type="range" id="textY" min="-5" max="60" value="24" oninput="previewEditor()">
                    </div>

                    <div style="display:flex; gap:10px; margin-top:10px;">
                        <select id="fontStyle" onchange="previewEditor()" style="flex:2;">
                            <option value="smallcaps">Small Caps (Elegan)</option>
                            <option value="regular">Regular Classic</option>
                        </select>
                        <input type="color" id="textColor" value="#ffffff" oninput="previewEditor()" style="flex:1; padding:0; height: 35px; cursor: pointer;" title="Warna Teks">
                    </div>
                    
                    <div style="display:flex; align-items:center; gap:10px; margin-top:10px;">
                        <label style="display:flex; align-items:center; gap:5px; color:#fff; cursor:pointer;">
                            <input type="checkbox" id="useShadow" checked onchange="previewEditor()"> Shadow
                        </label>
                        <button class="btn-success" style="flex:1;" onclick="stampText()">✅ BAKAR TEKS</button>
                    </div>
                </div>

                <!-- 3. MANUAL PIXEL BRUSH -->
                <div class="tool-box">
                    <h4 style="color:#fff;">🖌️ 3. Brush Manual</h4>
                    <div class="tool-row">
                        <input type="color" id="brushColor" value="#ffffff" style="width:40px; padding:0; height:35px;">
                        <button style="flex:1;" onclick="setTool('brush')" id="btnBrush">Brush</button>
                        <button style="flex:1; background:#444;" onclick="setTool('eraser')" id="btnEraser">Eraser</button>
                    </div>
                </div>

                <button class="btn-primary btn-full" style="padding: 15px; font-size: 14px;" onclick="saveEdit()">💾 SIMPAN & KEMBALI</button>
            </div>
        </div>
    </div>

    <script>
        const masterCanvas = document.getElementById('masterCanvas');
        const mCtx = masterCanvas.getContext('2d', { willReadFrequently: true });
        const editCanvas = document.getElementById('editCanvas');
        const eCtx = editCanvas.getContext('2d', { willReadFrequently: true });
        const gallery = document.getElementById('galleryContainer');
        
        let mainImage = new Image();
        let glyphDataList = []; 
        let isImageLoaded = false;
        let baseEditorCanvas = document.createElement('canvas'); 
        let baseCtx = baseEditorCanvas.getContext('2d', { willReadFrequently: true });
        let isDrawing = false;
        let activeTool = 'brush';

        // 9 WARNA CARD MENU
        const rankColors = [
            { id: "mod", color: "#55FF55", name: "Hijau Cerah" },
            { id: "admin", color: "#c0392b", name: "Merah Gelap" },
            { id: "owner", color: "#f1c40f", name: "Emas Mahkota" },
            { id: "celestora", color: "#3498db", name: "Biru Laut" },
            { id: "diamond", color: "#00FFFF", name: "Cyan Diamond" },
            { id: "crystalon", color: "#9b59b6", name: "Ungu Amethyst" },
            { id: "silver", color: "#ecf0f1", name: "Putih Perak" },
            { id: "mythoria", color: "#e74c3c", name: "Merah Terang" },
            { id: "eternalis", color: "#e67e22", name: "Oranye" }
        ];

        // 9 ICON CARD MENU
        const iconList = [
            { id: "none", label: "❌" },
            { id: "crown", label: "👑" },
            { id: "skull", label: "💀" },
            { id: "youtube", label: "▶️" },
            { id: "shield", label: "🛡️" },
            { id: "check", label: "✔️" },
            { id: "lightning", label: "⚡" },
            { id: "sword", label: "⚔️" },
            { id: "gem", label: "💎" }
        ];

        let selectedColor = rankColors[1].color; // Default Merah Admin
        let selectedIcon = iconList[2].id; // Default Skull

        // Render Visual Pickers
        function initPickers() {
            const cp = document.getElementById('colorPicker');
            rankColors.forEach(c => {
                let div = document.createElement('div');
                div.className = 'color-box' + (c.color === selectedColor ? ' active' : '');
                div.style.background = c.color; div.title = c.name;
                div.onclick = () => {
                    document.querySelectorAll('.color-box').forEach(el => el.classList.remove('active'));
                    div.classList.add('active'); selectedColor = c.color;
                };
                cp.appendChild(div);
            });

            const ip = document.getElementById('iconPicker');
            iconList.forEach(ic => {
                let div = document.createElement('div');
                div.className = 'icon-box' + (ic.id === selectedIcon ? ' active' : '');
                div.innerText = ic.label; div.title = ic.id;
                div.onclick = () => {
                    document.querySelectorAll('.icon-box').forEach(el => el.classList.remove('active'));
                    div.classList.add('active'); selectedIcon = ic.id;
                };
                ip.appendChild(div);
            });
        }

        // Fonts
        const regularFont = {
            'A': ["010","101","111","101","101"], 'B': ["110","101","110","101","110"], 'C': ["011","100","100","100","011"], 'D': ["110","101","101","101","110"], 'E': ["111","100","111","100","111"], 'F': ["111","100","110","100","100"], 'G': ["011","100","101","101","011"], 'H': ["101","101","111","101","101"], 'I': ["111","010","010","010","111"], 'J': ["001","001","001","101","010"], 'K': ["101","101","110","101","101"], 'L': ["100","100","100","100","111"], 'M': ["10001","11011","10101","10001","10001"], 'N': ["1001","1101","1011","1001","1001"], 'O': ["010","101","101","101","010"], 'P': ["110","101","110","100","100"], 'Q': ["010","101","101","011","001"], 'R': ["110","101","110","101","101"], 'S': ["011","100","010","001","110"], 'T': ["111","010","010","010","010"], 'U': ["101","101","101","101","011"], 'V': ["101","101","101","101","010"], 'W': ["10001","10001","10101","11011","10001"], 'X': ["101","101","010","101","101"], 'Y': ["101","101","010","010","010"], 'Z': ["111","001","010","100","111"], '1': ["010","110","010","010","111"], '2': ["010","101","001","010","111"], '3': ["110","001","010","001","110"], '0': ["010","101","101","101","010"]
        };

        const smallCapsFont = {
            'A': ["0110","1001","1111","1001","1001"], 'B': ["1110","1001","1110","1001","1110"], 'C': ["0111","1000","1000","1000","0111"], 'D': ["1110","1001","1001","1001","1110"], 'E': ["1111","1000","1110","1000","1111"], 'F': ["1111","1000","1110","1000","1000"], 'G': ["0111","1000","1011","1001","0111"], 'H': ["1001","1001","1111","1001","1001"], 'I': ["111","010","010","010","111"], 'J': ["0001","0001","0001","1001","0110"], 'K': ["1001","1010","1100","1010","1001"], 'L': ["1000","1000","1000","1000","1111"], 'M': ["10001","11011","10101","10001","10001"], 'N': ["1001","1101","1011","1001","1001"], 'O': ["0110","1001","1001","1001","0110"], 'P': ["1110","1001","1110","1000","1000"], 'Q': ["0110","1001","1001","0110","0001"], 'R': ["1110","1001","1110","1010","1001"], 'S': ["0111","1000","0110","0001","1110"], 'T': ["111","010","010","010","010"], 'U': ["1001","1001","1001","1001","0110"], 'V': ["1001","1001","1001","0110","0110"], 'W': ["10001","10001","10101","11011","10001"], 'X': ["10001","01010","00100","01010","10001"], 'Y': ["1001","0110","0010","0010","0010"], 'Z': ["1111","0001","0010","0100","1111"]
        };

        const icons = {
            crown: ["00100100","01000010","11011011","11111111","11111111"],
            skull: ["011110","111111","101101","111111","010010"],
            youtube: ["01111110","11111111","11110111","11111011","11110111","11111111","01111110"],
            shield: ["111111","100001","100001","010010","001100"],
            check: ["000001","000011","100110","111100","011000"],
            lightning: ["00110","01100","11111","00110","01000"],
            sword: ["00001","00011","01110","11100","01000"],
            gem: ["011110","111111","011110","001100"],
            leaf: ["0010","0110","1111","0110","0010"]
        };

        function shadeColor(color, percent) {
            let R = parseInt(color.substring(1,3),16); let G = parseInt(color.substring(3,5),16); let B = parseInt(color.substring(5,7),16);
            R = parseInt(R * (100 + percent) / 100); G = parseInt(G * (100 + percent) / 100); B = parseInt(B * (100 + percent) / 100);
            R = Math.min(255, Math.max(0, R)); G = Math.min(255, Math.max(0, G)); B = Math.min(255, Math.max(0, B));
            return "#"+((R.toString(16).padStart(2,'0')))+((G.toString(16).padStart(2,'0')))+((B.toString(16).padStart(2,'0')));
        }

        function createEmptyCanvas() {
            masterCanvas.width = 960; masterCanvas.height = 960;
            mCtx.clearRect(0,0,960,960); isImageLoaded = true;
            processGlyphs();
        }

        document.getElementById('uploadFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                mainImage.onload = () => {
                    masterCanvas.width = mainImage.width; masterCanvas.height = mainImage.height;
                    mCtx.drawImage(mainImage, 0, 0); isImageLoaded = true;
                    processGlyphs();
                }
                mainImage.src = ev.target.result;
            }
            reader.readAsDataURL(file);
        });

        function processGlyphs() {
            if(!isImageLoaded) return alert("Load image/buat kosong dulu!");
            const cols = parseInt(document.getElementById('gridCols').value);
            const rows = parseInt(document.getElementById('gridRows').value);
            const baseHexNum = parseInt(document.getElementById('baseHex').value, 16);
            
            // 960 / 16 = 60px
            const cellW = masterCanvas.width / cols; const cellH = masterCanvas.height / rows;

            glyphDataList = []; gallery.innerHTML = ''; 
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = cellW; tempCanvas.height = cellH;
            const tCtx = tempCanvas.getContext('2d');

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const currentHex = (baseHexNum + (r * cols) + c).toString(16).toUpperCase();
                    const x = c * cellW; const y = r * cellH;
                    tCtx.clearRect(0, 0, cellW, cellH);
                    tCtx.drawImage(masterCanvas, x, y, cellW, cellH, 0, 0, cellW, cellH);
                    const glyphObj = { id: `gl_${c}_${r}`, x, y, w: cellW, h: cellH, hex: currentHex, imgData: tempCanvas.toDataURL() };
                    glyphDataList.push(glyphObj);
                    
                    const card = document.createElement('div'); card.className = 'glyph-card';
                    card.innerHTML = `<img src="${glyphObj.imgData}" class="glyph-img" id="img_${glyphObj.id}">
                                      <div class="hex-code">\\u${glyphObj.hex}</div>
                                      <div class="card-actions">
                                        <button class="btn-warning" onclick="openEditor('${glyphObj.id}')">✏️ EDIT</button>
                                        <button class="btn-success" onclick="downloadSingle('${glyphObj.id}')">⬇️ DL</button>
                                      </div>`;
                    gallery.appendChild(card);
                }
            }
        }

        function downloadSingle(id) {
            const glyph = glyphDataList.find(g => g.id === id);
            const link = document.createElement('a'); link.download = `glyph_${glyph.hex}.png`;
            link.href = document.getElementById(`img_${id}`).src; link.click();
        }

        function openEditor(id) {
            currentEditGlyph = glyphDataList.find(g => g.id === id);
            editCanvas.width = currentEditGlyph.w; editCanvas.height = currentEditGlyph.h;
            baseEditorCanvas.width = currentEditGlyph.w; baseEditorCanvas.height = currentEditGlyph.h;
            
            document.getElementById('textX').max = currentEditGlyph.w;
            document.getElementById('textY').max = currentEditGlyph.h;
            
            baseCtx.clearRect(0,0, currentEditGlyph.w, currentEditGlyph.h);
            baseCtx.drawImage(masterCanvas, currentEditGlyph.x, currentEditGlyph.y, currentEditGlyph.w, currentEditGlyph.h, 0, 0, currentEditGlyph.w, currentEditGlyph.h);
            previewEditor();
            document.getElementById('editorModal').style.display = 'flex';
        }

        function closeEditor() { document.getElementById('editorModal').style.display = 'none'; }

        // ENGINE TEXT PREVIEW (PERFECT SHADOW #3F3F3F)
        function previewEditor() {
            eCtx.clearRect(0,0, editCanvas.width, editCanvas.height);
            eCtx.drawImage(baseEditorCanvas, 0, 0);
            
            const txt = document.getElementById('customText').value.toUpperCase();
            if(txt) {
                const tx = parseInt(document.getElementById('textX').value);
                const ty = parseInt(document.getElementById('textY').value);
                const tCol = document.getElementById('textColor').value;
                const fontSelect = document.getElementById('fontStyle').value;
                const hasShadow = document.getElementById('useShadow').checked;
                
                const activeFont = fontSelect === 'smallcaps' ? smallCapsFont : regularFont;

                const drawChar = (char, ox, oy, col) => {
                    const map = activeFont[char] || activeFont['?'] || ["111","101","111"]; 
                    for(let r=0; r<map.length; r++) {
                        for(let c=0; c<map[r].length; c++) {
                            if(map[r][c]==='1') {
                                eCtx.fillStyle = col; 
                                eCtx.fillRect(ox+c, oy+r, 1, 1);
                            }
                        }
                    }
                    return map[0].length + 1; // Spasi
                };

                let curX = tx;
                for(let char of txt) {
                    if(char === ' ') { curX += 3; continue; }
                    
                    if(hasShadow) {
                        // Murni 1px offset, warna #3F3F3F standar Minecraft Shadow
                        drawChar(char, curX + 1, ty + 1, '#3F3F3F'); 
                    }
                    let width = drawChar(char, curX, ty, tCol);
                    curX += width;
                }
            }
        }

        function stampText() {
            baseCtx.drawImage(editCanvas, 0, 0); 
            document.getElementById('customText').value = ""; previewEditor();
        }

        // ENGINE TEMPLATE KOTAK (DYNAMIC BORDER LUAR)
        function applyTemplate() {
            const baseColor = selectedColor;
            if(!baseColor) return;
            const w = editCanvas.width; const h = editCanvas.height;
            
            // Konfigurasi Warna DYNAMIC
            const cOutline = shadeColor(baseColor, -65); // BORDER LUAR: 65% lebih gelap dari base (Bukan item!)
            const cBorderLight = shadeColor(baseColor, 50);  
            const cBorderDark = shadeColor(baseColor, -30);  
            const cTop = baseColor; 
            const cBot = shadeColor(baseColor, -25); 
            
            baseCtx.clearRect(0,0,w,h);
            const bh=14, iw=14, tw=40, gap=1;
            // Gambar di tengah kanvas 60x60
            const sx = Math.floor((w-(iw+gap+tw))/2), sy = Math.floor((h-bh)/2);
            
            const drawBox = (x, y, bw) => {
                // 1. Outline Luar (Dynamic Dark Color)
                baseCtx.fillStyle = cOutline;
                baseCtx.fillRect(x, y, bw, bh);

                // 2. Inner Highlight
                baseCtx.fillStyle = cBorderLight;
                baseCtx.fillRect(x+1, y+1, bw-2, 1); 
                baseCtx.fillRect(x+1, y+1, 1, bh-2); 

                // 3. Inner Shadow
                baseCtx.fillStyle = cBorderDark;
                baseCtx.fillRect(x+1, y+bh-2, bw-2, 1); 
                baseCtx.fillRect(x+bw-2, y+1, 1, bh-2); 

                // 4. Center Smooth Gradient
                const grad = baseCtx.createLinearGradient(0, y+2, 0, y+bh-2);
                grad.addColorStop(0, cTop);
                grad.addColorStop(1, cBot);
                baseCtx.fillStyle = grad;
                baseCtx.fillRect(x+2, y+2, bw-4, bh-4);
            };

            drawBox(sx, sy, iw); 
            drawBox(sx+iw+gap, sy, tw);
            
            const iconName = selectedIcon;
            const iCol = document.getElementById('iconColor').value;
            const useIGrad = document.getElementById('iconGradient').checked;

            if(iconName !== 'none' && icons[iconName]) {
                const icon = icons[iconName];
                const iH = icon.length; const iW = icon[0].length;
                const ix = sx + Math.floor((iw-iW)/2);
                const iy = sy + Math.floor((bh-iH)/2);

                let iconFill = iCol;
                if(useIGrad) {
                    const gradIcon = baseCtx.createLinearGradient(0, iy, 0, iy+iH);
                    gradIcon.addColorStop(0, iCol); 
                    gradIcon.addColorStop(1, shadeColor(iCol, -40)); 
                    iconFill = gradIcon;
                }

                for(let r=0; r<iH; r++) {
                    for(let c=0; c<iW; c++) {
                        if(icon[r][c] === '1') { 
                            baseCtx.fillStyle = iconFill; 
                            baseCtx.fillRect(ix+c, iy+r, 1, 1); 
                        }
                    }
                }
            }
            previewEditor();
        }

        // TOUCH/MOUSE DRAWING MANUAL
        function setTool(t) { activeTool = t; document.getElementById('btnBrush').style.border = t==='brush'?'2px solid white':'none'; document.getElementById('btnEraser').style.border = t==='eraser'?'2px solid white':'none'; }
        function getEventPos(e) { const r = editCanvas.getBoundingClientRect(); const s = editCanvas.width/r.width; const clientX = e.touches?e.touches[0].clientX : e.clientX; const clientY = e.touches?e.touches[0].clientY : e.clientY; return { x: Math.floor((clientX-r.left)*s), y: Math.floor((clientY-r.top)*s) }; }
        
        const startDraw = (e) => { isDrawing = true; draw(e); };
        const moveDraw = (e) => { if(isDrawing) { e.preventDefault(); draw(e); } };
        const stopDraw = () => { isDrawing = false; };
        
        function draw(e) {
            const p = getEventPos(e);
            if(activeTool==='eraser') baseCtx.clearRect(p.x, p.y, 1, 1);
            else { baseCtx.fillStyle = document.getElementById('brushColor').value; baseCtx.clearRect(p.x, p.y, 1, 1); baseCtx.fillRect(p.x, p.y, 1, 1); }
            previewEditor();
        }

        editCanvas.addEventListener('mousedown', startDraw); editCanvas.addEventListener('mousemove', moveDraw); window.addEventListener('mouseup', stopDraw);
        editCanvas.addEventListener('touchstart', startDraw, {passive:false}); editCanvas.addEventListener('touchmove', moveDraw, {passive:false}); editCanvas.addEventListener('touchend', stopDraw);

        function saveEdit() {
            mCtx.clearRect(currentEditGlyph.x, currentEditGlyph.y, currentEditGlyph.w, currentEditGlyph.h);
            mCtx.drawImage(editCanvas, currentEditGlyph.x, currentEditGlyph.y);
            document.getElementById(`img_${currentEditGlyph.id}`).src = editCanvas.toDataURL();
            closeEditor();
        }

        function downloadMaster() { const link = document.createElement('a'); link.download='master_glyph.png'; link.href=masterCanvas.toDataURL(); link.click(); }

        window.onload = initPickers;
    </script>
</body>
