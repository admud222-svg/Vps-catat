<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eldoria Ultimate Studio v13</title>
    <style>
        :root {
            --bg-main: #0f1012; --bg-panel: #1e1f22; --primary: #5865F2;
            --success: #23a559; --warning: #f0b232; --danger: #da373c;
            --text-main: #dbdee1; --border: #2b2d31; --gold: #faa61a;
        }

        body {
            background-color: var(--bg-main); color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center;
        }

        h1 { color: #fff; margin: 10px 0; text-align: center; font-size: 1.4rem; letter-spacing: 1px; }

        .toolbar {
            background: var(--bg-panel); padding: 15px; border-radius: 12px;
            display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 15px; width: 100%; max-width: 1000px;
            box-sizing: border-box; border: 1px solid var(--border);
        }

        .tool-row { display: flex; gap: 10px; width: 100%; flex-wrap: wrap; align-items: center; }
        .input-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 90px; }
        label { font-size: 10px; color: #888; font-weight: bold; text-transform: uppercase; }
        
        input[type="file"], input[type="text"], input[type="number"], select {
            background: #111214; border: 1px solid #333; color: white;
            padding: 10px; border-radius: 6px; font-family: monospace; width: 100%; box-sizing: border-box;
            outline: none; font-size: 13px;
        }
        
        button {
            background: var(--primary); color: white; border: none; box-sizing: border-box;
            padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s;
            font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        button:active { transform: scale(0.95); }
        .btn-success { background: var(--success); }
        .btn-warning { background: var(--warning); color: black; }
        .btn-danger { background: var(--danger); }
        .btn-full { width: 100%; }

        .workspace { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 1000px; }
        @media (min-width: 850px) { .workspace { display: grid; grid-template-columns: 350px 1fr; } }

        .master-viewer {
            background: var(--bg-panel); padding: 15px; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; border: 1px solid var(--border);
        }
        
        .canvas-wrapper {
            width: 100%; max-width: 320px; aspect-ratio: 1/1; background: #000;
            overflow: hidden; border: 1px solid #000; border-radius: 4px; position: relative;
            background-image: linear-gradient(45deg, #161719 25%, transparent 25%), linear-gradient(-45deg, #161719 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #161719 75%), linear-gradient(-45deg, transparent 75%, #161719 75%);
            background-size: 20px 20px;
        }
        
        #masterCanvas, #editCanvas { width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; }

        .glyph-gallery {
            background: var(--bg-panel); padding: 15px; border-radius: 12px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px; max-height: 80vh; overflow-y: auto; align-content: start; border: 1px solid var(--border);
        }

        .glyph-card {
            background: #111214; border: 1px solid #222; border-radius: 8px;
            padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        
        .glyph-img {
            width: 70px; height: 70px; background: #000; image-rendering: pixelated;
            border: 1px dashed #444; background-size: 10px 10px;
        }

        .hex-code { font-family: monospace; font-size: 12px; color: var(--gold); }
        .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; width: 100%; }

        /* MODAL EDITOR MOBILE OPTIMIZED */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: flex-start; z-index: 1000;
            overflow-y: auto; padding: 10px 0; box-sizing: border-box;
        }
        .modal {
            background: var(--bg-panel); border-radius: 12px; width: 95%; max-width: 450px;
            border: 2px solid var(--primary); display: flex; flex-direction: column; margin: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        
        .modal-header { 
            padding: 12px 15px; border-bottom: 1px solid #333; display: flex; 
            justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--bg-panel); z-index: 10; 
            border-top-left-radius: 10px; border-top-right-radius: 10px;
        }

        .sticky-canvas-area {
            position: sticky; top: 53px; z-index: 20; background: var(--bg-panel);
            padding: 15px; border-bottom: 1px solid #333; box-shadow: 0 5px 10px rgba(0,0,0,0.4);
        }

        .editor-canvas-wrap {
            width: 100%; max-width: 220px; aspect-ratio: 1/1; border: 2px solid #000; margin: 0 auto;
            background-image: linear-gradient(45deg, #111 25%, transparent 25%), linear-gradient(-45deg, #111 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #111 75%), linear-gradient(-45deg, transparent 75%, #111 75%);
            background-size: 20px 20px; cursor: crosshair; border-radius: 4px; overflow: hidden;
        }

        .modal-body { padding: 15px; display: flex; flex-direction: column; gap: 8px; }

        /* ACCORDION MENU (Biar ga penuh layar) */
        details {
            background: #111214; border-radius: 8px; border: 1px solid #333; overflow: hidden;
        }
        summary {
            padding: 12px 15px; font-size: 12px; color: var(--gold); font-weight: bold; text-transform: uppercase;
            cursor: pointer; background: #18191c; list-style: none; display: flex; justify-content: space-between;
        }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: "▼"; font-size: 10px; color: #888; }
        details[open] summary::after { content: "▲"; }
        .details-content { padding: 15px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid #333; }

        .visual-picker { display: flex; flex-wrap: wrap; gap: 8px; }
        .color-box {
            width: 25px; height: 25px; border-radius: 4px; cursor: pointer; border: 2px solid #333; transition: 0.2s;
        }
        .color-box.active { border-color: var(--gold); transform: scale(1.15); box-shadow: 0 0 8px var(--gold); }
        .icon-box {
            width: 28px; height: 28px; border-radius: 4px; cursor: pointer; background: #1e1f22; border: 2px solid #333; 
            display: flex; justify-content: center; align-items: center; font-size: 14px; transition: 0.2s;
        }
        .icon-box.active { border-color: var(--gold); background: #333; }

        .slider-group { display: flex; align-items: center; gap: 8px; }
        .slider-group label { width: 55px; color: #fff; font-size: 10px; }
        input[type="range"] { flex: 1; accent-color: var(--success); }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
    </style>
</head>
<body>

    <h1>✨ ELDORIA ULTIMATE v13</h1>

    <div class="toolbar">
        <div class="tool-row">
            <div class="input-group" style="flex: 2;">
                <label>Spritesheet (960x960 PNG)</label>
                <input type="file" id="uploadFile">
            </div>
            <button class="btn-warning" onclick="createEmptyCanvas()" style="margin-top: 15px;">✨ KANVAS KOSONG</button>
        </div>
        <div class="tool-row">
            <div class="input-group"><label>X Grid</label><input type="number" id="gridCols" value="16"></div>
            <div class="input-group"><label>Y Grid</label><input type="number" id="gridRows" value="16"></div>
            <div class="input-group"><label>Hex Awal</label><input type="text" id="baseHex" value="E100"></div>
            <button class="btn-success" onclick="processGlyphs()" style="margin-top: 15px;">⚙️ PISAHKAN</button>
        </div>
    </div>

    <div class="workspace">
        <div class="master-viewer">
            <div class="canvas-wrapper"><canvas id="masterCanvas"></canvas></div>
            <button class="btn-success btn-full" style="margin-top: 15px;" onclick="downloadMaster()">⬇️ EXPORT MASTER 960x960</button>
        </div>
        <div class="glyph-gallery" id="galleryContainer"></div>
    </div>

    <div class="modal-overlay" id="editorModal">
        <div class="modal">
            <div class="modal-header">
                <span id="editTitle" style="font-weight:bold; color:var(--gold);">EDIT GLYPH</span>
                <button class="btn-danger" onclick="closeEditor()" style="padding: 5px 10px; font-size: 11px;">TUTUP</button>
            </div>
            
            <!-- STICKY CANVAS PREVIEW -->
            <div class="sticky-canvas-area">
                <div class="editor-canvas-wrap">
                    <canvas id="editCanvas"></canvas>
                </div>
            </div>

            <div class="modal-body">
                
                <!-- SECTION 1: STYLE & WARNA -->
                <details open>
                    <summary>🛡️ 1. Desain Base & Warna</summary>
                    <div class="details-content">
                        <label>Warna Rank (9 Pilihan):</label>
                        <div class="visual-picker" id="colorPicker"></div>

                        <label>Style Background (16 Pilihan Extrim):</label>
                        <select id="bgStyle">
                            <option value="classic">1. Classic Eldoria (Halus + 3D Border)</option>
                            <option value="shiny">2. Shiny Glass (Garis Cahaya Diagonal)</option>
                            <option value="flat">3. Flat Minimalist (Solid, no gradient)</option>
                            <option value="split">4. Split Half (Atas Terang, Bawah Gelap)</option>
                            <option value="dotted">5. Dotted Overlay (Titik-titik retro)</option>
                            <option value="neon">6. Cyber Neon (Background Hitam, Border Nyala)</option>
                            <option value="scanline">7. Scanline CRT (Garis Horizontal)</option>
                            <option value="metal">8. Metallic Brushed (Gradient Besi)</option>
                            <option value="carbon">9. Carbon Fiber (Gelap Elegan)</option>
                            <option value="hollow">10. Hollow Outline (Tengah Transparan)</option>
                            <option value="grid">11. Grid Overlay (Kotak-kotak halus)</option>
                            <option value="bevel">12. Hard Bevel (3D Kaku/Tegas)</option>
                            <option value="inset">13. Inset Pressed (Tenggelam ke dalam)</option>
                            <option value="glass">14. Frosted Glass (Terang Transparan)</option>
                            <option value="vintage">15. Vintage Sepia (Warna Pudar Coklat)</option>
                            <option value="ultimate">16. Eldoria Ultimate (Kombinasi Sempurna)</option>
                        </select>
                    </div>
                </details>

                <!-- SECTION 2: ICON & SHADOW -->
                <details>
                    <summary>✨ 2. Logo Icon & Shadow (14 Icon)</summary>
                    <div class="details-content">
                        <div class="visual-picker" id="iconPicker"></div>
                        
                        <div class="tool-row">
                            <div class="input-group">
                                <label>Warna Icon</label>
                                <input type="color" id="iconColor" value="#ffffff" style="height:35px; padding:0; cursor:pointer;">
                            </div>
                            <div class="input-group" style="justify-content:center;">
                                <label style="display:flex; align-items:center; gap:5px; color:#fff; cursor:pointer; font-size:12px; margin-top:15px;">
                                    <input type="checkbox" id="iconGradient" checked> Gradasi Icon
                                </label>
                            </div>
                        </div>

                        <div style="border-top: 1px dashed #333; padding-top:10px;">
                            <label style="display:flex; align-items:center; gap:5px; color:#fff; cursor:pointer; font-size:12px; margin-bottom:10px;">
                                <input type="checkbox" id="useIconShadow" checked> Aktifkan Shadow Icon
                            </label>
                            <div class="tool-row">
                                <div class="input-group"><label>Shadow X</label><input type="number" id="iconShadowX" value="0" style="padding:5px;"></div>
                                <div class="input-group"><label>Shadow Y</label><input type="number" id="iconShadowY" value="1" style="padding:5px;"></div>
                                <div class="input-group"><label>Warna</label><input type="color" id="iconShadowColor" value="#111111" style="height:28px; padding:0;"></div>
                                <div class="input-group"><label>Opacity</label><input type="number" id="iconShadowOp" value="0.7" step="0.1" min="0" max="1" style="padding:5px;"></div>
                            </div>
                        </div>

                        <button class="btn-warning btn-full" onclick="applyTemplate()">TERAPKAN BASE & ICON</button>
                    </div>
                </details>

                <!-- SECTION 3: TEKS -->
                <details open>
                    <summary>🔤 3. Cetak Teks & Shadow</summary>
                    <div class="details-content">
                        <input type="text" id="customText" placeholder="Ketik teks (Cth: MOD)" oninput="previewEditor()">
                        
                        <div class="tool-row" style="margin-top:5px;">
                            <select id="fontStyle" onchange="previewEditor()" style="flex:2;">
                                <option value="modern">Modern Elegance (Baru)</option>
                                <option value="smallcaps">Small Caps</option>
                                <option value="regular">Regular Classic</option>
                            </select>
                            <input type="color" id="textColor" value="#ffffff" oninput="previewEditor()" style="flex:1; padding:0; height: 35px; cursor: pointer;">
                        </div>

                        <div class="slider-group" style="margin-top:10px;"><label>GESER X</label><input type="range" id="textX" min="-5" max="60" value="23" oninput="previewEditor()"></div>
                        <div class="slider-group"><label>GESER Y</label><input type="range" id="textY" min="-5" max="60" value="24" oninput="previewEditor()"></div>

                        <div style="border-top: 1px dashed #333; padding-top:10px; margin-top:5px;">
                            <label style="display:flex; align-items:center; gap:5px; color:#fff; cursor:pointer; font-size:12px; margin-bottom:10px;">
                                <input type="checkbox" id="useTextShadow" checked onchange="previewEditor()"> Aktifkan Shadow Teks (Cahaya Depan)
                            </label>
                            <div class="tool-row">
                                <div class="input-group"><label>Shadow X</label><input type="number" id="textShadowX" value="0" oninput="previewEditor()" style="padding:5px;"></div>
                                <div class="input-group"><label>Shadow Y</label><input type="number" id="textShadowY" value="1" oninput="previewEditor()" style="padding:5px;"></div>
                                <div class="input-group"><label>Warna</label><input type="color" id="textShadowColor" value="#3F3F3F" oninput="previewEditor()" style="height:28px; padding:0;"></div>
                                <div class="input-group"><label>Opacity</label><input type="number" id="textShadowOp" value="1.0" step="0.1" min="0" max="1" oninput="previewEditor()" style="padding:5px;"></div>
                            </div>
                        </div>

                        <button class="btn-success btn-full" onclick="stampText()" style="margin-top:10px;">✅ BAKAR TEKS KE GAMBAR</button>
                    </div>
                </details>

                <!-- SECTION 4: MANUAL BRUSH -->
                <details>
                    <summary>🖌️ 4. Brush Manual</summary>
                    <div class="details-content">
                        <div class="tool-row">
                            <input type="color" id="brushColor" value="#ffffff" style="width:40px; padding:0; height:35px;">
                            <button style="flex:1;" onclick="setTool('brush')" id="btnBrush">Brush</button>
                            <button style="flex:1; background:#444;" onclick="setTool('eraser')" id="btnEraser">Eraser</button>
                        </div>
                    </div>
                </details>

                <button class="btn-primary btn-full" style="padding: 15px; font-size: 14px; margin-top: 10px;" onclick="saveEdit()">💾 SIMPAN PERUBAHAN & KEMBALI</button>
            </div>
        </div>
    </div>

        const mCtx = masterCanvas.getContext('2d', { willReadFrequently: true });

        let selectedColor = rankColors[1].color; 
        let selectedIcon = iconList[2].id; 

        function initPickers() {
            const cp = document.getElementById('colorPicker');
            rankColors.forEach(c => {

            potion: ["001100","001100","011110","111111","011110"], 
            book: ["000000","011011","111111","111111","011011"], 
            anvil: ["11111","00100","01110","11111","00000"]
        };

        function shadeColor(color, percent) {
            let R = parseInt(color.substring(1,3),16); let G = parseInt(color.substring(3,5),16); let B = parseInt(color.substring(5,7),16);
            R = parseInt(R * (100 + percent) / 100); G = parseInt(G * (100 + percent) / 100); B = parseInt(B * (100 + percent) / 100);
            R = Math.min(255, Math.max(0, R)); G = Math.min(255, Math.max(0, G)); B = Math.min(255, Math.max(0, B));
            return "#"+((R.toString(16).padStart(2,'0')))+((G.toString(16).padStart(2,'0')))+((B.toString(16).padStart(2,'0')));
        }

        function hexToRgbaAlpha(hex, alpha) {
            let R = parseInt(hex.substring(1,3),16); let G = parseInt(hex.substring(3,5),16); let B = parseInt(hex.substring(5,7),16);
            return `rgba(${R},${G},${B},${alpha})`;
        }

        function createEmptyCanvas() {
            masterCanvas.width = 960; masterCanvas.height = 960;
            mCtx.clearRect(0,0,960,960); isImageLoaded = true;
            processGlyphs();
        }

        document.getElementById('uploadFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                mainImage.onload = () => {
                    masterCanvas.width = mainImage.width; masterCanvas.height = mainImage.height;
                    mCtx.drawImage(mainImage, 0, 0); isImageLoaded = true;
                    processGlyphs();
                }
                mainImage.src = ev.target.result;
            }
            reader.readAsDataURL(file);
        });

        function processGlyphs() {
            if(!isImageLoaded) return alert("Load image/buat kosong dulu!");
            const cols = parseInt(document.getElementById('gridCols').value);
            const rows = parseInt(document.getElementById('gridRows').value);
            const baseHexNum = parseInt(document.getElementById('baseHex').value, 16);
            const cellW = masterCanvas.width / cols; const cellH = masterCanvas.height / rows;

            glyphDataList = []; gallery.innerHTML = ''; 
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = cellW; tempCanvas.height = cellH;
            const tCtx = tempCanvas.getContext('2d');

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const currentHex = (baseHexNum + (r * cols) + c).toString(16).toUpperCase();
                    const x = c * cellW; const y = r * cellH;
                    tCtx.clearRect(0, 0, cellW, cellH);
                    tCtx.drawImage(masterCanvas, x, y, cellW, cellH, 0, 0, cellW, cellH);
                    const glyphObj = { id: `gl_${c}_${r}`, x, y, w: cellW, h: cellH, hex: currentHex, imgData: tempCanvas.toDataURL() };
                    glyphDataList.push(glyphObj);
                    
                    const card = document.createElement('div'); card.className = 'glyph-card';
                    card.innerHTML = `<img src="${glyphObj.imgData}" class="glyph-img" id="img_${glyphObj.id}">
                                      <div class="hex-code">\\u${glyphObj.hex}</div>
                                      <div class="card-actions">
                                        <button class="btn-warning" onclick="openEditor('${glyphObj.id}')">✏️ EDIT</button>
                                        <button class="btn-success" onclick="downloadSingle('${glyphObj.id}')">⬇️ DL</button>
                                      </div>`;
                    gallery.appendChild(card);
                }
            }
        }

        function downloadSingle(id) {
            const glyph = glyphDataList.find(g => g.id === id);
            const link = document.createElement('a'); link.download = `glyph_${glyph.hex}.png`;
            link.href = document.getElementById(`img_${id}`).src; link.click();
        }

        function openEditor(id) {
            currentEditGlyph = glyphDataList.find(g => g.id === id);
            editCanvas.width = currentEditGlyph.w; editCanvas.height = currentEditGlyph.h;
            baseEditorCanvas.width = currentEditGlyph.w; baseEditorCanvas.height = currentEditGlyph.h;
            
            document.getElementById('textX').max = currentEditGlyph.w;
            document.getElementById('textY').max = currentEditGlyph.h;
            
            baseCtx.clearRect(0,0, currentEditGlyph.w, currentEditGlyph.h);
            baseCtx.drawImage(masterCanvas, currentEditGlyph.x, currentEditGlyph.y, currentEditGlyph.w, currentEditGlyph.h, 0, 0, currentEditGlyph.w, currentEditGlyph.h);
            previewEditor();
            document.getElementById('editorModal').style.display = 'flex';
        }

        function closeEditor() { document.getElementById('editorModal').style.display = 'none'; }

        // TEXT SHADOW DYNAMIC SYSTEM
        function previewEditor() {
            eCtx.clearRect(0,0, editCanvas.width, editCanvas.height);
            eCtx.drawImage(baseEditorCanvas, 0, 0);
            
            const txt = document.getElementById('customText').value.toUpperCase();
            if(txt) {
                const tx = parseInt(document.getElementById('textX').value);
                const ty = parseInt(document.getElementById('textY').value);
                const tCol = document.getElementById('textColor').value;
                const fontSelect = document.getElementById('fontStyle').value;
                const hasShadow = document.getElementById('useShadow').checked;
                
                const sx = parseInt(document.getElementById('textShadowX').value);
                const sy = parseInt(document.getElementById('textShadowY').value);
                const sColHex = document.getElementById('textShadowColor').value;
                const sOp = document.getElementById('textShadowOp').value;
                const shadowFill = hexToRgbaAlpha(sColHex, sOp);

                let activeFont = regularFont;
                if(fontSelect === 'smallcaps') activeFont = smallCapsFont;
                if(fontSelect === 'modern') activeFont = modernFont;

                const drawChar = (char, ox, oy, col) => {
                    const map = activeFont[char] || activeFont['?'] || ["111","101","111"]; 
                    for(let r=0; r<map.length; r++) {
                        for(let c=0; c<map[r].length; c++) {
                            if(map[r][c]==='1') {
                                eCtx.fillStyle = col; eCtx.fillRect(ox+c, oy+r, 1, 1);
                            }
                        }
                    }
                    return map[0].length + 1; 
                };

                // Shadow Pass
                if(hasShadow) {
                    let curX = tx;
                    for(let char of txt) {
                        if(char === ' ') { curX += 3; continue; }
                        drawChar(char, curX + sx, ty + sy, shadowFill); 
                        curX += (activeFont[char]?activeFont[char][0].length + 1 : 4);
                    }
                }
                
                // Text Pass
                let curX = tx;
                for(let char of txt) {
                    if(char === ' ') { curX += 3; continue; }
                    let width = drawChar(char, curX, ty, tCol);
                    curX += width;
                }
            }
        }

        function stampText() {
            baseCtx.drawImage(editCanvas, 0, 0); 
            document.getElementById('customText').value = ""; previewEditor();
        }

        // 16 BACKGROUND STYLES & SHADOW ICON SYSTEM
        function applyTemplate() {
            const baseColor = selectedColor;
            if(!baseColor) return;
            const style = document.getElementById('bgStyle').value;
            const w = editCanvas.width; const h = editCanvas.height;
            
            const cOutline = shadeColor(baseColor, -65); 
            const cBorderLight = shadeColor(baseColor, 50);  
            const cBorderDark = shadeColor(baseColor, -30);  
            const cTop = baseColor; 
            const cBot = shadeColor(baseColor, -25); 
            
            baseCtx.clearRect(0,0,w,h);
            const bh=14, iw=14, tw=40, gap=1;
            const sx = Math.floor((w-(iw+gap+tw))/2), sy = Math.floor((h-bh)/2);
            
            const drawBox = (x, y, bw) => {
                // Background & Styles
                if(style === 'neon') {
                    baseCtx.fillStyle = '#000'; baseCtx.fillRect(x, y, bw, bh);
                    baseCtx.fillStyle = baseColor; baseCtx.fillRect(x, y, bw, 1); baseCtx.fillRect(x, y, 1, bh); baseCtx.fillRect(x, y+bh-1, bw, 1); baseCtx.fillRect(x+bw-1, y, 1, bh);
                } else if(style === 'hollow') {
                    baseCtx.fillStyle = 'rgba(0,0,0,0)'; baseCtx.clearRect(x,y,bw,bh);
                    baseCtx.fillStyle = baseColor; baseCtx.fillRect(x, y, bw, 1); baseCtx.fillRect(x, y, 1, bh); baseCtx.fillRect(x, y+bh-1, bw, 1); baseCtx.fillRect(x+bw-1, y, 1, bh);
                } else {
                    baseCtx.fillStyle = cOutline; baseCtx.fillRect(x, y, bw, bh); // Outline luar
                    
                    if(style==='flat') {
                        baseCtx.fillStyle = baseColor; baseCtx.fillRect(x+1, y+1, bw-2, bh-2);
                    } else if(style==='split') {
                        baseCtx.fillStyle = cTop; baseCtx.fillRect(x+1, y+1, bw-2, Math.floor(bh/2));
                        baseCtx.fillStyle = cBot; baseCtx.fillRect(x+1, y+1+Math.floor(bh/2), bw-2, bh-2-Math.floor(bh/2));
                    } else if(style==='glass') {
                        baseCtx.fillStyle = shadeColor(baseColor, -50); baseCtx.fillRect(x+1, y+1, bw-2, bh-2);
                        baseCtx.fillStyle = 'rgba(255,255,255,0.2)'; baseCtx.fillRect(x+1, y+1, bw-2, bh-2);
                    } else if(style==='vintage') {
                        baseCtx.fillStyle = '#A0522D'; baseCtx.fillRect(x+1, y+1, bw-2, bh-2);
                    } else {
                        // Classic Gradient Base
                        const grad = baseCtx.createLinearGradient(0, y+1, 0, y+bh-1);
                        grad.addColorStop(0, cTop); grad.addColorStop(1, cBot);
                        baseCtx.fillStyle = grad; baseCtx.fillRect(x+1, y+1, bw-2, bh-2);
                        
                        if(style==='shiny') {
                            baseCtx.fillStyle = 'rgba(255,255,255,0.3)';
                            baseCtx.beginPath(); baseCtx.moveTo(x+1, y+bh-2); baseCtx.lineTo(x+1+Math.floor(bw/3), y+1); baseCtx.lineTo(x+1+Math.floor(bw/2), y+1); baseCtx.lineTo(x+1+Math.floor(bw/6), y+bh-2); baseCtx.fill();
                        }
                        if(style==='scanline') {
                            baseCtx.fillStyle = 'rgba(0,0,0,0.2)';
                            for(let i=y+2; i<y+bh-1; i+=2) baseCtx.fillRect(x+1, i, bw-2, 1);
                        }
                        if(style==='dotted') {
                            baseCtx.fillStyle = shadeColor(baseColor, -40);
                            for(let i=y+1; i<y+bh-1; i+=2) for(let j=x+1; j<x+bw-1; j+=2) baseCtx.fillRect(j, i, 1, 1);
                        }
                        if(style==='metal') {
                            const mg = baseCtx.createLinearGradient(0, y+1, 0, y+bh-1);
                            mg.addColorStop(0, '#ddd'); mg.addColorStop(0.5, '#888'); mg.addColorStop(1, '#bbb');
                            baseCtx.fillStyle = mg; baseCtx.fillRect(x+1, y+1, bw-2, bh-2);
                        }
                        if(style==='carbon') {
                            baseCtx.fillStyle = '#111'; baseCtx.fillRect(x+1, y+1, bw-2, bh-2);
                            baseCtx.fillStyle = '#222';
                            for(let i=y+1; i<y+bh-1; i+=2) for(let j=x+1+(i%4===0?0:1); j<x+bw-1; j+=2) baseCtx.fillRect(j, i, 1, 1);
                        }
                        if(style==='grid') {
                            baseCtx.fillStyle = 'rgba(0,0,0,0.1)';
                            for(let i=y+1; i<y+bh-1; i+=3) baseCtx.fillRect(x+1, i, bw-2, 1);
                            for(let j=x+1; j<x+bw-1; j+=3) baseCtx.fillRect(j, y+1, 1, bh-2);
                        }
                        if(style==='ultimate') {
                            baseCtx.fillStyle = shadeColor(baseColor,-20); baseCtx.fillRect(x+1, y+1, bw-2, bh-2);
                            baseCtx.fillStyle = baseColor; baseCtx.fillRect(x+2, y+2, bw-4, bh-4);
                            baseCtx.fillStyle = 'rgba(255,255,255,0.2)'; baseCtx.fillRect(x+2, y+2, bw-4, Math.floor(bh/2)-1);
                        }
                    }

                    // Inner Borders (kecuali styles tertentu)
                    if(style!=='flat' && style!=='glass' && style!=='neon' && style!=='hollow' && style!=='vintage' && style!=='metal') {
                        if(style==='inset') {
                            baseCtx.fillStyle = cBorderDark; baseCtx.fillRect(x+1, y+1, bw-2, 1); baseCtx.fillRect(x+1, y+1, 1, bh-2); 
                            baseCtx.fillStyle = cBorderLight; baseCtx.fillRect(x+1, y+bh-2, bw-2, 1); baseCtx.fillRect(x+bw-2, y+1, 1, bh-2); 
                        } else {
                            baseCtx.fillStyle = cBorderLight; baseCtx.fillRect(x+1, y+1, bw-2, 1); baseCtx.fillRect(x+1, y+1, 1, bh-2); 
                            baseCtx.fillStyle = cBorderDark; baseCtx.fillRect(x+1, y+bh-2, bw-2, 1); baseCtx.fillRect(x+bw-2, y+1, 1, bh-2); 
                        }
                    }
                }
            };

            drawBox(sx, sy, iw); drawBox(sx+iw+gap, sy, tw);
            
            // GAMBAR ICON & SHADOWNYA
            const iconName = selectedIcon;
            if(iconName !== 'none' && iconsMatrix[iconName]) {
                const icon = iconsMatrix[iconName];
                const iH = icon.length; const iW = icon[0].length;
                const ix = sx + Math.floor((iw-iW)/2);
                const iy = sy + Math.floor((bh-iH)/2);

                const iCol = document.getElementById('iconColor').value;
                const useIGrad = document.getElementById('iconGradient').checked;
                const useIShadow = document.getElementById('useIconShadow').checked;

                // Shadow Icon Pass
                if(useIShadow) {
                    const isx = parseInt(document.getElementById('iconShadowX').value);
                    const isy = parseInt(document.getElementById('iconShadowY').value);
                    const isHex = document.getElementById('iconShadowColor').value;
                    const isOp = document.getElementById('iconShadowOp').value;
                    baseCtx.fillStyle = hexToRgbaAlpha(isHex, isOp);
                    for(let r=0; r<iH; r++) for(let c=0; c<iW; c++) if(icon[r][c] === '1') baseCtx.fillRect(ix+c+isx, iy+r+isy, 1, 1); 
                }

                // Main Icon Pass
                let iconFill = iCol;
                if(useIGrad) {
                    const gradIcon = baseCtx.createLinearGradient(0, iy, 0, iy+iH);
                    gradIcon.addColorStop(0, iCol); gradIcon.addColorStop(1, shadeColor(iCol, -40)); 
                    iconFill = gradIcon;
                }
                for(let r=0; r<iH; r++) for(let c=0; c<iW; c++) if(icon[r][c] === '1') { baseCtx.fillStyle = iconFill; baseCtx.fillRect(ix+c, iy+r, 1, 1); }
            }
            previewEditor();
        }

        function setTool(t) { activeTool = t; document.getElementById('btnBrush').style.border = t==='brush'?'2px solid white':'none'; document.getElementById('btnEraser').style.border = t==='eraser'?'2px solid white':'none'; }
        function getEventPos(e) { const r = editCanvas.getBoundingClientRect(); const s = editCanvas.width/r.width; const clientX = e.touches?e.touches[0].clientX : e.clientX; const clientY = e.touches?e.touches[0].clientY : e.clientY; return { x: Math.floor((clientX-r.left)*s), y: Math.floor((clientY-r.top)*s) }; }
        
        const startDraw = (e) => { isDrawing = true; draw(e); };
        const moveDraw = (e) => { if(isDrawing) { e.preventDefault(); draw(e); } };
        const stopDraw = () => { isDrawing = false; };
        
        function draw(e) {
            const p = getEventPos(e);
            if(activeTool==='eraser') baseCtx.clearRect(p.x, p.y, 1, 1);
            else { baseCtx.fillStyle = document.getElementById('brushColor').value; baseCtx.clearRect(p.x, p.y, 1, 1); baseCtx.fillRect(p.x, p.y, 1, 1); }
            previewEditor();
        }

        editCanvas.addEventListener('mousedown', startDraw); editCanvas.addEventListener('mousemove', moveDraw); window.addEventListener('mouseup', stopDraw);
        editCanvas.addEventListener('touchstart', startDraw, {passive:false}); editCanvas.addEventListener('touchmove', moveDraw, {passive:false}); editCanvas.addEventListener('touchend', stopDraw);

        function saveEdit() {
            mCtx.clearRect(currentEditGlyph.x, currentEditGlyph.y, currentEditGlyph.w, currentEditGlyph.h);
            mCtx.drawImage(editCanvas, currentEditGlyph.x, currentEditGlyph.y);
            document.getElementById(`img_${currentEditGlyph.id}`).src = editCanvas.toDataURL();
            closeEditor();
        }

        function downloadMaster() { const link = document.createElement('a'); link.download='master_glyph.png'; link.href=masterCanvas.toDataURL(); link.click(); }

        window.onload = initPickers;
    </script>
