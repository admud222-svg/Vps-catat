<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eldoria Supreme Studio v25</title>
    <style>
        :root {
            --bg-main: #070809; --bg-panel: #111214; --primary: #5865F2;
            --success: #23a559; --warning: #f0b232; --danger: #da373c;
            --text-main: #dbdee1; --border: #222428; --gold: #faa61a;
        }

        body { background-color: var(--bg-main); color: var(--text-main); font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #fff; margin: 10px 0; text-align: center; font-size: 1.4rem; letter-spacing: 1px; text-shadow: 0 0 10px rgba(250,166,26,0.5); }

        /* Toolbar */
        .toolbar { background: var(--bg-panel); padding: 15px; border-radius: 12px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.8); margin-bottom: 15px; width: 100%; max-width: 1000px; box-sizing: border-box; border: 1px solid var(--border); }
        .tool-row { display: flex; gap: 10px; width: 100%; flex-wrap: wrap; align-items: center; }
        .input-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 90px; }
        label { font-size: 10px; color: #888; font-weight: bold; text-transform: uppercase; }
        input[type="file"], input[type="text"], input[type="number"], select { background: #000; border: 1px solid #333; color: white; padding: 10px; border-radius: 6px; font-family: monospace; width: 100%; box-sizing: border-box; outline: none; font-size: 13px; }
        
        button { background: var(--primary); color: white; border: none; box-sizing: border-box; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        button:active { transform: scale(0.95); }
        .btn-success { background: var(--success); } .btn-warning { background: var(--warning); color: black; } .btn-danger { background: var(--danger); } .btn-full { width: 100%; }

        /* Workspace */
        .workspace { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 1000px; }
        @media (min-width: 850px) { .workspace { display: grid; grid-template-columns: 320px 1fr; } }

        .master-viewer { background: var(--bg-panel); padding: 15px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; border: 1px solid var(--border); }
        .canvas-wrapper { width: 100%; max-width: 280px; aspect-ratio: 1/1; background: #000; overflow: hidden; border: 1px solid #000; border-radius: 4px; position: relative; background-image: linear-gradient(45deg, #111 25%, transparent 25%), linear-gradient(-45deg, #111 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #111 75%), linear-gradient(-45deg, transparent 75%, #111 75%); background-size: 20px 20px; }
        #masterCanvas, #editCanvas { width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; }

        .glyph-gallery { background: var(--bg-panel); padding: 15px; border-radius: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; max-height: 80vh; overflow-y: auto; align-content: start; border: 1px solid var(--border); }
        .glyph-card { background: #070809; border: 1px solid #222; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .glyph-img { width: 64px; height: 64px; background-color: #000; image-rendering: pixelated; border: 1px dashed #444; border-radius: 4px; background-image: linear-gradient(45deg, #0a0a0a 25%, transparent 25%), linear-gradient(-45deg, #0a0a0a 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #0a0a0a 75%), linear-gradient(-45deg, transparent 75%, #0a0a0a 75%); background-size: 10px 10px; }
        .hex-code { font-family: monospace; font-size: 12px; color: var(--gold); }
        .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; width: 100%; }

        /* Modal Editor: Solid & Clean */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: none; justify-content: center; align-items: flex-start; z-index: 1000; overflow-y: auto; }
        .modal { background: #0a0b0c; width: 100%; max-width: 500px; min-height: 100vh; display: flex; flex-direction: column; border-left: 1px solid #333; border-right: 1px solid #333; position: relative;}
        .modal-header { padding: 12px 15px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: #0a0b0c; z-index: 40; }
        
        .sticky-canvas-area { position: sticky; top: 52px; z-index: 30; background: #0f1012; padding: 15px; border-bottom: 2px solid #222; box-shadow: 0 5px 15px rgba(0,0,0,0.9); }
        .editor-canvas-wrap { width: 180px; height: 180px; border: 2px solid #000; margin: 0 auto; background-image: linear-gradient(45deg, #111 25%, transparent 25%), linear-gradient(-45deg, #111 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #111 75%), linear-gradient(-45deg, transparent 75%, #111 75%); background-size: 20px 20px; cursor: crosshair; image-rendering: pixelated; border-radius: 4px;}

        .modal-body { padding: 15px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 100px; }
        details { background: #111214; border-radius: 8px; border: 1px solid #222; overflow: hidden; margin-bottom: 5px; }
        summary { padding: 12px 15px; font-size: 11px; color: var(--gold); font-weight: bold; cursor: pointer; background: #161719; list-style: none; display: flex; justify-content: space-between; align-items: center;}
        summary::after { content: "▼"; font-size: 9px; color: #888; }
        .details-content { padding: 15px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #222; }

        .visual-picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(30px, 1fr)); gap: 8px; }
        .color-box { width: 100%; aspect-ratio: 1/1; border-radius: 6px; cursor: pointer; border: 2px solid #333; transition: 0.1s; }
        .color-box.active { border-color: #fff; transform: scale(1.1); box-shadow: 0 0 10px var(--gold); }
        .icon-box { width: 100%; aspect-ratio: 1/1; border-radius: 6px; cursor: pointer; background: #000; border: 1px solid #333; display: flex; justify-content: center; align-items: center; font-size: 16px; transition: 0.1s; color: #fff; }
        .icon-box.active { border-color: #fff; background: #222; transform: scale(1.1); }
        
        .style-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .style-btn { background: #000; border: 1px solid #333; padding: 10px 5px; border-radius: 6px; font-size: 10px; color: #ccc; cursor: pointer; text-align: center; transition: 0.1s; }
        .style-btn.active { background: var(--primary); color: white; border-color: #fff; font-weight: bold;}
        
        .slider-group { display: flex; align-items: center; gap: 8px; }
        .slider-group label { width: 65px; color: #aaa; font-size: 10px; font-weight: bold; }
        input[type="range"] { flex: 1; accent-color: var(--success); cursor: pointer; }

        /* FLOATING TERAPKAN BUTTON */
        .floating-actions { position: sticky; bottom: 0; left: 0; right: 0; background: #0a0b0c; padding: 15px; border-top: 1px solid #333; display: flex; gap: 10px; z-index: 50; }
        
        ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
        .empty-state { text-align: center; color: #666; padding: 50px 20px; grid-column: 1 / -1; font-size: 14px;}
    </style>
</head>
<body>

    <h1>💎 ELDORIA PIXEL STUDIO SUPREME</h1>

    <div class="toolbar">
        <div class="tool-row">
            <div class="input-group" style="flex: 2;">
                <label>Upload File (PNG 1024x1024)</label>
                <input type="file" id="uploadFile" accept="image/png">
            </div>
            <button class="btn-warning" onclick="createEmptyCanvas()" style="margin-top: 15px;">✨ KANVAS KOSONG</button>
        </div>
        <div class="tool-row">
            <div class="input-group"><label>Grid Cells</label><input type="text" value="16x16" readonly style="background:#000; color:#555;"></div>
            <div class="input-group"><label>Hex Awal</label><input type="text" id="baseHex" value="E100"></div>
            <button class="btn-success" onclick="processGlyphs()" style="margin-top: 15px;">⚙️ PISAHKAN</button>
        </div>
    </div>

    <div class="workspace">
        <div class="master-viewer">
            <div class="canvas-wrapper"><canvas id="masterCanvas" width="1024" height="1024"></canvas></div>
            <button class="btn-success btn-full" style="margin-top: 15px;" onclick="downloadMaster()">⬇️ EXPORT MASTER PNG</button>
        </div>
        <div class="glyph-gallery" id="galleryContainer">
            <div class="empty-state">
                Galeri kosong. Upload gambar atau klik Kanvas Kosong.
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="editorModal">
        <div class="modal">
            <div class="modal-header">
                <span id="editTitle" style="font-weight:bold; color:var(--gold);">DESIGN EDITOR V25</span>
                <button class="btn-danger" onclick="closeEditor()" style="padding: 6px 12px;">X</button>
            </div>
            
            <div class="sticky-canvas-area">
                <div class="editor-canvas-wrap">
                    <canvas id="editCanvas" width="64" height="64"></canvas>
                </div>
                <div class="slider-group" style="margin-top:15px; background: #000; padding: 10px; border-radius: 8px; border: 1px solid #333;">
                    <label style="color:var(--gold);">BOX WIDTH</label>
                    <input type="range" id="boxWidth" min="20" max="56" value="42" oninput="applyTemplate()">
                </div>
            </div>

            <div class="modal-body">
                
                <details open>
                    <summary>🛡️ 1. WARNA & STYLE (20 PILIHAN)</summary>
                    <div class="details-content">
                        <div class="visual-picker" id="colorPicker"></div>
                        <div class="style-grid" id="stylePicker" style="margin-top:10px;"></div>
                    </div>
                </details>

                <details open>
                    <summary>🔤 2. TEKS & 4 FONT ENGINE</summary>
                    <div class="details-content">
                        <input type="text" id="customText" placeholder="SILVERLIGHT / MOD / ADMIN..." oninput="previewEditor()">
                        <div class="tool-row">
                            <select id="fontStyle" onchange="previewEditor()" style="flex:2.5;">
                                <option value="capsbold">Caps Small Bold (Paling Baru)</option>
                                <option value="mcten">Minecraft Ten (Original)</option>
                                <option value="smallcaps">Small Caps (Elegan)</option>
                                <option value="regular">Regular Classic (1px)</option>
                            </select>
                            <input type="color" id="textColor" value="#ffffff" oninput="previewEditor()" style="flex:1; height:38px; padding:0; cursor:pointer;">
                        </div>
                        <div class="slider-group"><label>POS X</label><input type="range" id="textX" min="0" max="64" value="23" oninput="previewEditor()"></div>
                        <div class="slider-group"><label>POS Y</label><input type="range" id="textY" min="0" max="64" value="26" oninput="previewEditor()"></div>
                        
                        <div style="background: #000; padding: 10px; border-radius: 8px; border: 1px solid #333; margin-top: 5px;">
                            <label style="display:flex; align-items:center; gap:5px; color:#fff; font-size:11px; margin-bottom: 8px;">
                                <input type="checkbox" id="useTextShadow" checked onchange="previewEditor()"> Shadow Teks
                            </label>
                            <div class="tool-row">
                                <div class="input-group"><label>S-X</label><input type="number" id="textShadowX" value="1" oninput="previewEditor()"></div>
                                <div class="input-group"><label>S-Y</label><input type="number" id="textShadowY" value="1" oninput="previewEditor()"></div>
                                <div class="input-group"><label>Warna</label><input type="color" id="textShadowColor" value="#3F3F3F" oninput="previewEditor()" style="height:30px; padding:0;"></div>
                            </div>
                        </div>
                        <button class="btn-success btn-full" onclick="stampText()" style="margin-top:10px;">✅ BAKAR TEKS</button>
                    </div>
                </details>

                <details>
                    <summary>✨ 3. LOGO ICON & SHADOW (20 PILIHAN)</summary>
                    <div class="details-content">
                        <div class="visual-picker" id="iconPicker" style="grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));"></div>
                        <div class="tool-row" style="margin-top:10px; background: #000; padding: 10px; border-radius: 8px;">
                            <div class="input-group"><label>Warna Icon</label><input type="color" id="iconColor" value="#ffffff" style="height:35px; padding:0;"></div>
                            <label style="display:flex; align-items:center; gap:5px; color:#fff; font-size:11px; margin-top:15px;">
                                <input type="checkbox" id="iconGradient" checked> Gradasi
                            </label>
                        </div>
                        <div style="background: #000; padding: 10px; border-radius: 8px; border: 1px solid #333; margin-top: 10px;">
                            <label style="display:flex; align-items:center; gap:5px; color:#fff; font-size:11px; margin-bottom: 8px;">
                                <input type="checkbox" id="useIconShadow" checked> Shadow Icon
                            </label>
                            <div class="tool-row">
                                <div class="input-group"><label>S-X</label><input type="number" id="iconShadowX" value="1"></div>
                                <div class="input-group"><label>S-Y</label><input type="number" id="iconShadowY" value="1"></div>
                                <div class="input-group"><label>Warna</label><input type="color" id="iconShadowColor" value="#222222" style="height:30px; padding:0;"></div>
                            </div>
                        </div>
                    </div>
                </details>

                <details>
                    <summary>🖌️ 4. BRUSH MANUAL</summary>
                    <div class="details-content">
                        <div class="tool-row">
                            <input type="color" id="brushColor" value="#ffffff" style="width:40px; padding:0; height:35px;">
                            <button style="flex:1;" onclick="setTool('brush')" id="btnBrush">Brush</button>
                            <button style="flex:1; background:#444;" onclick="setTool('eraser')" id="btnEraser">Eraser</button>
                        </div>
                    </div>
                </details>

                <button class="btn-primary btn-full" style="padding: 18px; font-size: 14px; margin-top: 10px;" onclick="saveEdit()">💾 SIMPAN SEMUA KE MASTER</button>
            </div>

            <div class="floating-actions">
                <button class="btn-warning btn-full" style="padding:15px;" onclick="applyTemplate()">⚡ TERAPKAN BASE & ICON</button>
            </div>
        </div>
    </div>

    <script>
        const masterCanvas = document.getElementById('masterCanvas');
        const mCtx = masterCanvas.getContext('2d', { willReadFrequently: true });
        const editCanvas = document.getElementById('editCanvas');
        const eCtx = editCanvas.getContext('2d', { willReadFrequently: true });
        const gallery = document.getElementById('galleryContainer');
        
        let glyphDataList = []; let isImageLoaded = false;
        let baseEditorCanvas = document.createElement('canvas'); 
        baseEditorCanvas.width = 64; baseEditorCanvas.height = 64;
        let baseCtx = baseEditorCanvas.getContext('2d', { willReadFrequently: true });
        let currentEditGlyph = null; let isDrawing = false; let activeTool = 'brush';
        let mainImage = new Image();

        const rankColors = [
            { color: "#55FF55", name: "Lime" }, { color: "#c0392b", name: "Admin" }, { color: "#f1c40f", name: "Owner" },
            { color: "#3498db", name: "Blue" }, { color: "#00FFFF", name: "Cyan" }, { color: "#9b59b6", name: "Purple" },
            { color: "#ecf0f1", name: "Silver" }, { color: "#e74c3c", name: "Red" }, { color: "#e67e22", name: "Orange" },
            { color: "#bdc3c7", name: "Iron" }, { color: "#8e44ad", name: "Void" }, { color: "#1abc9c", name: "Plat" },
            { color: "#d35400", name: "Bronze" }, { color: "#2ecc71", name: "Green" }, { color: "#ff69b4", name: "Pink" }
        ];

        const bgStyles = [
            { id: "classic", name: "Classic" }, { id: "shiny", name: "Shiny" }, { id: "glass", name: "Frosted" },
            { id: "encased", name: "Encased" }, { id: "split", name: "Split" }, { id: "bolt", name: "Lightning" },
            { id: "chaos", name: "Chaos" }, { id: "carbon", name: "Carbon" }, { id: "magma", name: "Magma" },
            { id: "scan", name: "Scanline" }, { id: "metal", name: "Metal" }, { id: "dots", name: "Dotted" },
            { id: "bevel", name: "Bevel" }, { id: "inset", name: "Inset" }, { id: "hollow", name: "Hollow" },
            { id: "aura", name: "Aura" }, { id: "ice", name: "Ice" }, { id: "vines", name: "Vines" },
            { id: "cyber", name: "Cyber" }, { id: "ultimate", name: "Ultimate" }
        ];

        const iconList = [
            { id: "none", label: "❌" }, { id: "crown", label: "👑" }, { id: "skull", label: "💀" },
            { id: "shield", label: "🛡️" }, { id: "check", label: "✔️" }, { id: "lightning", label: "⚡" },
            { id: "sword", label: "⚔️" }, { id: "gem", label: "💎" }, { id: "head", label: "👤" },
            { id: "queen", label: "👸" }, { id: "staff", label: "🪄" }, { id: "hammer", label: "🔨" },
            { id: "dragon", label: "🐲" }, { id: "helmet", label: "🪖" }, { id: "bow", label: "🏹" },
            { id: "potion", label: "🧪" }, { id: "book", label: "📖" }, { id: "anvil", label: "⚒️" },
            { id: "fire", label: "🔥" }, { id: "youtube", label: "▶️" }
        ];

        let selectedColor = rankColors[1].color; 
        let selectedStyle = bgStyles[0].id; 
        let selectedIcon = iconList[1].id;

        function initPickers() {
            const cp = document.getElementById('colorPicker'); cp.innerHTML = '';
            rankColors.forEach(c => {
                let div = document.createElement('div'); div.className = 'color-box' + (c.color === selectedColor ? ' active' : '');
                div.style.background = c.color; div.onclick = () => { document.querySelectorAll('.color-box').forEach(el => el.classList.remove('active')); div.classList.add('active'); selectedColor = c.color; };
                cp.appendChild(div);
            });
            const sp = document.getElementById('stylePicker'); sp.innerHTML = '';
            bgStyles.forEach(st => {
                let btn = document.createElement('div'); btn.className = 'style-btn' + (st.id === selectedStyle ? ' active' : '');
                btn.innerText = st.name; btn.onclick = () => { document.querySelectorAll('.style-btn').forEach(el => el.classList.remove('active')); btn.classList.add('active'); selectedStyle = st.id; };
                sp.appendChild(btn);
            });
            const ip = document.getElementById('iconPicker'); ip.innerHTML = '';
            iconList.forEach(ic => {
                let div = document.createElement('div'); div.className = 'icon-box' + (ic.id === selectedIcon ? ' active' : '');
                div.innerText = ic.label; div.onclick = () => { document.querySelectorAll('.icon-box').forEach(el => el.classList.remove('active')); div.classList.add('active'); selectedIcon = ic.id; };
                ip.appendChild(div);
            });
        }

        // FONT ENGINE SUPREME V25 (NEW CAPS SMALL BOLD ADDED)
        const capsBoldFont = {
            'A':["1111","1001","1111","1001","1001"], 'B':["1111","1001","1111","1001","1111"], 'C':["1111","1000","1000","1000","1111"],
            'D':["1111","1001","1001","1001","1111"], 'E':["1111","1000","1111","1000","1111"], 'F':["1111","1000","1111","1000","1000"],
            'G':["1111","1000","1011","1001","1111"], 'H':["1001","1001","1111","1001","1001"], 'I':["1111","0110","0110","0110","1111"],
            'J':["0011","0011","0011","1011","0111"], 'K':["1001","1010","1100","1010","1001"], 'L':["1000","1000","1000","1000","1111"],
            'M':["10001","11011","11111","10101","10001"], 'N':["1001","1101","1011","1001","1001"], 'O':["1111","1001","1001","1001","1111"],
            'P':["1111","1001","1111","1000","1000"], 'Q':["1111","1001","1001","1111","0011"], 'R':["1111","1001","1111","1010","1001"],
            'S':["1111","1000","1111","0001","1111"], 'T':["1111","0110","0110","0110","0110"], 'U':["1001","1001","1001","1001","1111"],
            'V':["1001","1001","1001","0110","0110"], 'W':["10001","10001","10101","11011","11111"], 'X':["1001","1001","0110","1001","1001"],
            'Y':["1001","1001","0110","0110","0110"], 'Z':["1111","0011","0110","1100","1111"]
        };

        const mcTenFont = {
            'A':["0110","1001","1111","1001","1001"], 'B':["1110","1001","1110","1001","1110"],
            'C':["0111","1000","1000","1000","0111"], 'D':["1110","1001","1001","1001","1110"],
            'E':["1111","1000","1110","1000","1111"], 'F':["1111","1000","1110","1000","1000"],
            'G':["0111","1000","1011","1001","0111"], 'H':["1001","1001","1111","1001","1001"],
            'O':["0110","1001","1001","1001","0110"], 'R':["1110","1001","1110","1010","1001"],
            'S':["0111","1000","0110","0001","1110"], 'T':["111","010","010","010","010"],
            'V':["10001","10001","01010","01010","00100"], 'I':["111","010","010","010","111"]
        };

        const smallCapsFont = { 
            'A':["010","101","111","101","101"], 'B':["110","101","110","101","110"], 
            'C':["011","100","100","100","011"], 'D':["110","101","101","101","110"], 
            'O':["010","101","101","101","010"], 'R':["110","101","110","101","101"], 
            'S':["011","100","010","001","110"], 'L':["100","100","100","100","111"], 
            'I':["111","010","010","010","111"]
        };

        const regularFont = smallCapsFont;

        const iconsMatrix = { 
            crown:["00100100","01000010","11011011","11111111","11111111"], skull:["011110","111111","101101","111111","010010"], 
            shield:["111111","100001","100001","010010","001100"], check:["000001","000011","100110","111100","011000"], 
            head:["01110","11111","11111","01110","11111"], queen:["10101","11111","11111","11111","01110"], 
            staff:["00100","01110","00100","00100","00100"], hammer:["11111","11111","00100","00100","00100"], 
            dragon:["01010","11111","11111","01110","10101"], youtube:["01111110","11111111","11110111","11111111","01111110"], 
            lightning:["00110","01100","11111","00110","01000"], sword:["00001","00011","01110","11100","01000"], gem:["011110","111111","011110","001100"],
            helmet:["011110","010010","110011","101101","100001"], bow:["00110","01010","10010","11000","00000"], 
            potion:["001100","001100","011110","111111","011110"], book:["000000","011011","111111","111111","011011"], 
            anvil:["11111","00100","01110","11111","00000"], fire:["00100","01100","11110","11111","01110"]
        };

        function shadeColor(color, percent) {
            let R = parseInt(color.substring(1,3),16); let G = parseInt(color.substring(3,5),16); let B = parseInt(color.substring(5,7),16);
            R = parseInt(R * (100 + percent) / 100); G = parseInt(G * (100 + percent) / 100); B = parseInt(B * (100 + percent) / 100);
            R = Math.min(255, Math.max(0, R)); G = Math.min(255, Math.max(0, G)); B = Math.min(255, Math.max(0, B));
            return "#"+((R.toString(16).padStart(2,'0')))+((G.toString(16).padStart(2,'0')))+((B.toString(16).padStart(2,'0')));
        }

        function createEmptyCanvas() { masterCanvas.width = 1024; masterCanvas.height = 1024; mCtx.clearRect(0,0,1024,1024); isImageLoaded = true; processGlyphs(); }

        document.getElementById('uploadFile').addEventListener('change', (e) => {
            const file = e.target.files[0]; if(!file) return;
            const reader = new FileReader(); reader.onload = (ev) => {
                mainImage.onload = () => { masterCanvas.width = mainImage.width; masterCanvas.height = mainImage.height; mCtx.clearRect(0, 0, masterCanvas.width, masterCanvas.height); mCtx.drawImage(mainImage, 0, 0); isImageLoaded = true; processGlyphs(); }
                mainImage.src = ev.target.result;
            }
            reader.readAsDataURL(file);
        });

        function processGlyphs() {
            if(!isImageLoaded) return;
            const cell = 64; glyphDataList = []; gallery.innerHTML = ''; 
            const temp = document.createElement('canvas'); temp.width = cell; temp.height = cell; const tCtx = temp.getContext('2d');
            const baseHex = parseInt(document.getElementById('baseHex').value, 16);
            for (let r = 0; r < 16; r++) for (let c = 0; c < 16; c++) {
                const hex = (baseHex + (r * 16) + c).toString(16).toUpperCase();
                tCtx.clearRect(0, 0, cell, cell); tCtx.drawImage(masterCanvas, c*cell, r*cell, cell, cell, 0, 0, cell, cell);
                const obj = { id: `gl_${c}_${r}`, x: c*cell, y: r*cell, hex, imgData: temp.toDataURL() };
                glyphDataList.push(obj);
                const card = document.createElement('div'); card.className = 'glyph-card';
                card.innerHTML = `<img src="${obj.imgData}" class="glyph-img" id="img_${obj.id}"><div class="hex-code">\\u${obj.hex}</div><div class="card-actions"><button class="btn-warning" onclick="openEditor('${obj.id}')">✏️</button><button class="btn-success" onclick="downloadSingle('${obj.id}')">⬇️</button></div>`;
                gallery.appendChild(card);
            }
        }

        function downloadSingle(id) { const g = glyphDataList.find(x => x.id === id); const a = document.createElement('a'); a.download = `glyph_${g.hex}.png`; a.href = document.getElementById(`img_${id}`).src; a.click(); }

        function openEditor(id) {
            currentEditGlyph = glyphDataList.find(g => g.id === id);
            editCanvas.width = 64; editCanvas.height = 64; baseEditorCanvas.width = 64; baseEditorCanvas.height = 64;
            baseCtx.clearRect(0,0, 64, 64); baseCtx.drawImage(masterCanvas, currentEditGlyph.x, currentEditGlyph.y, 64, 64, 0, 0, 64, 64);
            previewEditor(); document.getElementById('editorModal').style.display = 'flex';
        }
        function closeEditor() { document.getElementById('editorModal').style.display = 'none'; }

        function previewEditor() {
            eCtx.clearRect(0,0, 64, 64); eCtx.drawImage(baseEditorCanvas, 0, 0);
            const txt = document.getElementById('customText').value.toUpperCase();
            if(txt) {
                const tx = parseInt(document.getElementById('textX').value), ty = parseInt(document.getElementById('textY').value), tCol = document.getElementById('textColor').value;
                const fontSelect = document.getElementById('fontStyle').value, hasShadow = document.getElementById('useTextShadow').checked, sCol = document.getElementById('textShadowColor').value;
                
                let activeFont = mcTenFont;
                if(fontSelect === 'smallcaps') activeFont = smallCapsFont;
                if(fontSelect === 'regular') activeFont = regularFont;
                if(fontSelect === 'capsbold') activeFont = capsBoldFont;

                const drawChar = (char, ox, oy, col) => {
                    const map = activeFont[char] || regularFont[char] || regularFont['A']; 
                    for(let r=0; r<map.length; r++) for(let c=0; c<map[r].length; c++) if(map[r][c]==='1') { eCtx.fillStyle = col; eCtx.fillRect(ox+c, oy+r, 1, 1); }
                    return map[0].length + 1;
                };
                if(hasShadow) { 
                    const sx = parseInt(document.getElementById('textShadowX').value), sy = parseInt(document.getElementById('textShadowY').value);
                    let cx = tx; for(let char of txt) { if(char === ' ') { cx += 3; continue; } drawChar(char, cx + sx, ty + sy, sCol); cx += (activeFont[char]?activeFont[char][0].length + 1 : 4); } 
                }
                let cx = tx; for(let char of txt) { if(char === ' ') { cx += 3; continue; } cx += drawChar(char, cx, ty, tCol); }
            }
        }

        function stampText() { baseCtx.drawImage(editCanvas, 0, 0); document.getElementById('customText').value = ""; previewEditor(); }

        function applyTemplate() {
            const baseColor = selectedColor, style = selectedStyle;
            const textWidth = parseInt(document.getElementById('boxWidth').value);
            const cOutline = shadeColor(baseColor, -80), cBorderLight = shadeColor(baseColor, 40), cBorderDark = shadeColor(baseColor, -40); 
            baseCtx.clearRect(0,0,64,64);
            const bh=14, iw=14, tw=textWidth, gap=1;
            const sx = Math.floor((64-(iw+gap+tw))/2), sy = Math.floor((64-bh)/2);
            
            const drawBox = (x, y, bw) => {
                baseCtx.fillStyle = cOutline; baseCtx.fillRect(x, y, bw, bh);
                const inX = x+1, inY = y+1, inW = bw-2, inH = bh-2;
                baseCtx.fillStyle = baseColor; baseCtx.fillRect(inX, inY, inW, inH);
                
                if(style === 'classic' || style === 'ultimate') {
                    const grad = baseCtx.createLinearGradient(0, inY, 0, inY+inH); grad.addColorStop(0, shadeColor(baseColor, 15)); grad.addColorStop(1, shadeColor(baseColor, -25));
                    baseCtx.fillStyle = grad; baseCtx.fillRect(inX, inY, inW, inH);
                } 
                if(style === 'shiny') {
                    baseCtx.fillStyle = shadeColor(baseColor, 45);
                    for(let i=0; i<inW; i++) for(let j=0; j<inH; j++) if(i+j === 7 || i+j === 8) baseCtx.fillRect(inX+i, inY+j, 1, 1);
                }
                if(style === 'bolt') {
                    baseCtx.fillStyle = shadeColor(baseColor, 60); let lx = Math.floor(inW/2);
                    for(let j=0; j<inH; j++) { baseCtx.fillRect(inX+lx, inY+j, 1, 1); if(j%3===0) lx--; else lx++; }
                }
                if(style === 'magma') {
                    baseCtx.fillStyle = shadeColor(baseColor, -30); baseCtx.fillRect(inX, inY, inW, inH);
                    for(let i=0; i<inW; i++) { let hL = 2+((i*2)%3); baseCtx.fillStyle = shadeColor(baseColor, 30); baseCtx.fillRect(inX+i, inY+inH-hL, 1, hL); }
                }

                if(style !== 'hollow' && style !== 'flat') {
                    baseCtx.fillStyle = cBorderLight; baseCtx.fillRect(inX, inY, inW, 1); baseCtx.fillRect(inX, inY, 1, inH);
                    baseCtx.fillStyle = cBorderDark; baseCtx.fillRect(inX, inY+inH-1, inW, 1); baseCtx.fillRect(inX+inW-1, inY, 1, inH);
                }
            };
            drawBox(sx, sy, iw); drawBox(sx+iw+gap, sy, tw);
            const icon = iconsMatrix[selectedIcon];
            if(icon) {
                const ix = sx + Math.floor((iw-icon[0].length)/2), iy = sy + Math.floor((bh-icon.length)/2);
                const iCol = document.getElementById('iconColor').value;
                const useIShadow = document.getElementById('useIconShadow').checked;

                if(useIShadow) {
                    const isx = parseInt(document.getElementById('iconShadowX').value), isy = parseInt(document.getElementById('iconShadowY').value), isCol = document.getElementById('iconShadowColor').value;
                    baseCtx.fillStyle = isCol;
                    for(let r=0; r<icon.length; r++) for(let c=0; c<icon[r].length; c++) if(icon[r][c]==='1') baseCtx.fillRect(ix+c+isx, iy+r+isy, 1, 1);
                }

                for(let r=0; r<icon.length; r++) for(let c=0; c<icon[r].length; c++) if(icon[r][c]==='1') { 
                    baseCtx.fillStyle = document.getElementById('iconGradient').checked ? shadeColor(iCol, -r*10) : iCol;
                    baseCtx.fillRect(ix+c, iy+r, 1, 1); 
                }
            }
            previewEditor();
        }

        function setTool(t) { activeTool = t; document.getElementById('btnBrush').style.border = t==='brush'?'2px solid white':'none'; document.getElementById('btnEraser').style.border = t==='eraser'?'2px solid white':'none'; }
        function getEventPos(e) { const r = editCanvas.getBoundingClientRect(); const s = 64/r.width; const cx = e.touches?e.touches[0].clientX:e.clientX, cy = e.touches?e.touches[0].clientY:e.clientY; return { x: Math.floor((cx-r.left)*s), y: Math.floor((cy-r.top)*s) }; }
        const startDraw = (e) => { isDrawing = true; draw(e); };
        const moveDraw = (e) => { if(isDrawing) { e.preventDefault(); draw(e); } };
        const stopDraw = () => { isDrawing = false; };
        function draw(e) {
            const p = getEventPos(e); if(activeTool==='eraser') baseCtx.clearRect(p.x, p.y, 1, 1);
            else { baseCtx.fillStyle = document.getElementById('brushColor').value; baseCtx.fillRect(p.x, p.y, 1, 1); }
            previewEditor();
        }
        editCanvas.addEventListener('mousedown', startDraw); editCanvas.addEventListener('mousemove', moveDraw); window.addEventListener('mouseup', stopDraw);
        editCanvas.addEventListener('touchstart', startDraw, {passive:false}); editCanvas.addEventListener('touchmove', moveDraw, {passive:false}); editCanvas.addEventListener('touchend', stopDraw);

        function saveEdit() { mCtx.clearRect(currentEditGlyph.x, currentEditGlyph.y, 64, 64); mCtx.drawImage(editCanvas, currentEditGlyph.x, currentEditGlyph.y); document.getElementById(`img_${currentEditGlyph.id}`).src = editCanvas.toDataURL(); closeEditor(); }
        function downloadMaster() { const a = document.createElement('a'); a.download='master_1024.png'; a.href=masterCanvas.toDataURL(); a.click(); }
        window.onload = initPickers;
    </script>
</body>
