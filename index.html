<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eldoria Glyph Studio</title>
    <style>
        :root {
            --bg-main: #18191c;
            --bg-panel: #2b2d31;
            --primary: #5865F2;
            --success: #23a559;
            --warning: #f0b232;
            --danger: #da373c;
            --text-main: #dbdee1;
            --border: #1e1f22;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        h1 { color: #fff; margin-top: 0; text-align: center; }

        .toolbar {
            background: var(--bg-panel);
            padding: 15px 25px;
            border-radius: 8px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            width: 100%;
            max-width: 1200px;
            box-sizing: border-box;
        }

        .input-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 12px; color: #aaa; font-weight: bold; }
        input[type="file"], input[type="text"], input[type="number"] {
            background: var(--border); border: 1px solid #444; color: white;
            padding: 8px; border-radius: 4px; font-family: monospace;
        }
        
        button {
            background: var(--primary); color: white; border: none;
            padding: 10px 15px; border-radius: 4px; font-weight: bold;
            cursor: pointer; transition: 0.2s;
        }
        button:hover { filter: brightness(1.1); }
        .btn-success { background: var(--success); }
        .btn-warning { background: var(--warning); color: black; }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        /* Viewer Sprite Induk */
        .master-viewer {
            background: var(--bg-panel); padding: 15px; border-radius: 8px;
            display: flex; flex-direction: column; align-items: center;
        }
        .canvas-wrapper {
            width: 100%; max-width: 400px; aspect-ratio: 1/1;
            background: #000; overflow: hidden; position: relative;
            border: 2px solid var(--border); border-radius: 4px;
        }
        #masterCanvas { width: 100%; height: 100%; image-rendering: pixelated; }

        /* Galeri Glyph yang sudah dipisah */
        .glyph-gallery {
            background: var(--bg-panel); padding: 15px; border-radius: 8px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px; max-height: 700px; overflow-y: auto; align-content: start;
        }

        .glyph-card {
            background: var(--bg-main); border: 1px solid #444;
            border-radius: 6px; padding: 10px; display: flex;
            flex-direction: column; align-items: center; gap: 8px;
            transition: 0.2s;
        }
        .glyph-card:hover { border-color: var(--primary); transform: translateY(-2px); }
        
        .glyph-img {
            width: 60px; height: 60px; background: #000;
            image-rendering: pixelated; border: 1px dashed #555;
            background-image: linear-gradient(45deg, #222 25%, transparent 25%), linear-gradient(-45deg, #222 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #222 75%), linear-gradient(-45deg, transparent 75%, #222 75%);
            background-size: 10px 10px; background-position: 0 0, 0 5px, 5px -5px, -5px 0px;
        }

        .hex-code { font-family: monospace; font-size: 14px; font-weight: bold; color: var(--warning); }
        
        .card-actions { display: flex; gap: 5px; width: 100%; }
        .card-actions button { padding: 5px; font-size: 11px; flex: 1; }

        /* MODAL EDITOR PIXEL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; justify-content: center;
            align-items: center; z-index: 1000;
        }
        .modal {
            background: var(--bg-panel); padding: 20px; border-radius: 8px;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            border: 2px solid var(--primary);
        }
        .editor-canvas-wrap {
            width: 300px; height: 300px; border: 1px solid #555;
            background-image: linear-gradient(45deg, #222 25%, transparent 25%), linear-gradient(-45deg, #222 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #222 75%), linear-gradient(-45deg, transparent 75%, #222 75%);
            background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            cursor: crosshair;
        }
        #editCanvas { width: 100%; height: 100%; image-rendering: pixelated; }

        /* Scrollbar custom */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #777; }

        @media (max-width: 800px) {
            .workspace { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <h1>✨ Eldoria Glyph Studio</h1>

    <div class="toolbar">
        <div class="input-group">
            <label>1. Upload Sprite Glyph (PNG):</label>
            <input type="file" id="uploadFile" accept="image/png">
        </div>
        <div class="input-group">
            <label>Total Kolom (X):</label>
            <input type="number" id="gridCols" value="16" style="width: 80px;">
        </div>
        <div class="input-group">
            <label>Total Baris (Y):</label>
            <input type="number" id="gridRows" value="16" style="width: 80px;">
        </div>
        <div class="input-group">
            <label>Hex Awal (Base):</label>
            <input type="text" id="baseHex" value="E100" style="width: 100px;">
        </div>
        <button class="btn-success" onclick="processGlyphs()">⚙️ PISAHKAN GLYPH</button>
    </div>

    <div class="workspace">
        <!-- Panel Kiri: Master Image -->
        <div class="master-viewer">
            <h3 style="margin-top:0;">🗺️ Master Spritesheet</h3>
            <div class="canvas-wrapper">
                <canvas id="masterCanvas"></canvas>
            </div>
            <button class="btn-success" style="margin-top: 15px; width: 100%;" onclick="downloadMaster()">⬇️ EXPORT HASIL EDIT (PNG)</button>
            <p style="font-size: 11px; color: #888; text-align: center; margin-top: 10px;">
                Jika kamu sudah mengedit glyph di sebelah kanan, klik Export untuk mendownload gambar 960x960 yang baru.
            </p>
        </div>

        <!-- Panel Kanan: Galeri Glyph -->
        <div class="glyph-gallery" id="galleryContainer">
            <div style="grid-column: 1 / -1; text-align: center; color: #777; padding: 50px 0;">
                Silakan upload gambar dan klik "Pisahkan Glyph"
            </div>
        </div>
    </div>

    <!-- MODAL EDITOR PIXEL -->
    <div class="modal-overlay" id="editorModal">
        <div class="modal">
            <h3 style="margin: 0; color: var(--warning);" id="editTitle">✏️ Edit Glyph \uE100</h3>
            
            <div style="display: flex; gap: 10px; width: 100%;">
                <input type="color" id="brushColor" value="#ffffff" style="flex:1; height: 35px; cursor:pointer;">
                <button id="btnBrush" style="flex:1;" onclick="setTool('brush')">🖌️ Brush</button>
                <button id="btnEraser" style="flex:1; background: var(--border);" onclick="setTool('eraser')">🧹 Eraser</button>
            </div>

            <div class="editor-canvas-wrap">
                <canvas id="editCanvas"></canvas>
            </div>

            <div style="display: flex; gap: 10px; width: 100%;">
                <button style="flex: 1; background: var(--border);" onclick="closeEditor()">Batal</button>
                <button class="btn-success" style="flex: 1;" onclick="saveEdit()">💾 Simpan ke Master</button>
            </div>
        </div>
    </div>

    <script>
        const masterCanvas = document.getElementById('masterCanvas');
        const mCtx = masterCanvas.getContext('2d', { willReadFrequently: true });
        
        const editCanvas = document.getElementById('editCanvas');
        const eCtx = editCanvas.getContext('2d', { willReadFrequently: true });
        eCtx.imageSmoothingEnabled = false;

        const gallery = document.getElementById('galleryContainer');
        
        let mainImage = new Image();
        let glyphDataList = []; // Menyimpan data tiap glyph
        let isImageLoaded = false;

        // --- SISTEM UPLOAD & RENDER MASTER ---
        document.getElementById('uploadFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                mainImage.onload = () => {
                    masterCanvas.width = mainImage.width;
                    masterCanvas.height = mainImage.height;
                    mCtx.clearRect(0,0, masterCanvas.width, masterCanvas.height);
                    mCtx.drawImage(mainImage, 0, 0);
                    isImageLoaded = true;
                }
                mainImage.src = ev.target.result;
            }
            reader.readAsDataURL(file);
        });

        // --- SISTEM SLICER (Pemisah Glyph Otomatis) ---
        function processGlyphs() {
            if(!isImageLoaded) return alert("Upload gambar Glyph dulu bos!");
            
            const cols = parseInt(document.getElementById('gridCols').value);
            const rows = parseInt(document.getElementById('gridRows').value);
            const baseHexStr = document.getElementById('baseHex').value;
            const baseHexNum = parseInt(baseHexStr, 16);

            const cellW = masterCanvas.width / cols;
            const cellH = masterCanvas.height / rows;

            glyphDataList = [];
            gallery.innerHTML = ''; // Bersihkan galeri

            // Bikin canvas sementara buat nge-crop
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = cellW;
            tempCanvas.height = cellH;
            const tCtx = tempCanvas.getContext('2d');

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const currentHex = (baseHexNum + (r * cols) + c).toString(16).toUpperCase();
                    const x = c * cellW;
                    const y = r * cellH;

                    // Crop gambar dari master
                    tCtx.clearRect(0, 0, cellW, cellH);
                    tCtx.drawImage(masterCanvas, x, y, cellW, cellH, 0, 0, cellW, cellH);
                    
                    const dataURL = tempCanvas.toDataURL();
                    
                    const glyphObj = {
                        id: `glyph_${c}_${r}`, col: c, row: r,
                        x: x, y: y, w: cellW, h: cellH,
                        hex: currentHex, imgData: dataURL
                    };
                    glyphDataList.push(glyphObj);

                    // Bikin UI Card
                    createGlyphCard(glyphObj);
                }
            }
        }

        // --- BIKIN TAMPILAN KARTU GLYPH ---
        function createGlyphCard(glyph) {
            const card = document.createElement('div');
            card.className = 'glyph-card';
            card.id = `card_${glyph.id}`;

            card.innerHTML = `
                <img src="${glyph.imgData}" class="glyph-img" id="img_${glyph.id}">
                <div class="hex-code">\\u${glyph.hex}</div>
                <div class="card-actions">
                    <button onclick="copyHex('${glyph.hex}', this)">📋 Copy</button>
                    <button class="btn-warning" onclick="openEditor('${glyph.id}')">✏️ Edit</button>
                </div>
            `;
            gallery.appendChild(card);
        }

        // --- SISTEM COPY KE CLIPBOARD ---
        function copyHex(hex, btn) {
            // Copy format \uXXXX yang paling aman buat JSON Minecraft
            const textToCopy = `\\u${hex}`;
            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = btn.innerHTML;
                btn.innerHTML = "✅ Copied!";
                btn.style.background = "var(--success)";
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = "";
                }, 1500);
            });
        }

        // ==========================================
        // --- SISTEM PIXEL EDITOR (BISA DI EDIT) ---
        // ==========================================
        let currentEditGlyph = null;
        let isDrawing = false;
        let activeTool = 'brush'; // 'brush' atau 'eraser'

        function openEditor(glyphId) {
            currentEditGlyph = glyphDataList.find(g => g.id === glyphId);
            if(!currentEditGlyph) return;

            document.getElementById('editTitle').innerText = `✏️ Edit Glyph \\u${currentEditGlyph.hex}`;
            
            // Set ukuran canvas editor sesuai ukuran sel asli (misal 60x60)
            editCanvas.width = currentEditGlyph.w;
            editCanvas.height = currentEditGlyph.h;
            
            // Pindahkan gambar dari Master Canvas ke Edit Canvas
            eCtx.clearRect(0,0, editCanvas.width, editCanvas.height);
            eCtx.drawImage(masterCanvas, currentEditGlyph.x, currentEditGlyph.y, currentEditGlyph.w, currentEditGlyph.h, 0, 0, currentEditGlyph.w, currentEditGlyph.h);

            document.getElementById('editorModal').style.display = 'flex';
            setTool('brush');
        }

        function closeEditor() {
            document.getElementById('editorModal').style.display = 'none';
            currentEditGlyph = null;
        }

        function setTool(tool) {
            activeTool = tool;
            document.getElementById('btnBrush').style.background = tool === 'brush' ? 'var(--primary)' : 'var(--border)';
            document.getElementById('btnEraser').style.background = tool === 'eraser' ? 'var(--danger)' : 'var(--border)';
        }

        function hexToRgba(hex) {
            let r = parseInt(hex.slice(1, 3), 16);
            let g = parseInt(hex.slice(3, 5), 16);
            let b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, 1)`;
        }

        // Logic Menggambar di Canvas
        function drawOnEditor(e) {
            if (!isDrawing || !currentEditGlyph) return;
            const rect = editCanvas.getBoundingClientRect();
            const scaleX = editCanvas.width / rect.width;
            const scaleY = editCanvas.height / rect.height;
            
            const x = Math.floor((e.clientX - rect.left) * scaleX);
            const y = Math.floor((e.clientY - rect.top) * scaleY);

            if (activeTool === 'eraser') {
                eCtx.clearRect(x, y, 1, 1);
            } else {
                const color = document.getElementById('brushColor').value;
                eCtx.fillStyle = hexToRgba(color);
                eCtx.clearRect(x, y, 1, 1); // clear dulu biar gak numpuk alpha
                eCtx.fillRect(x, y, 1, 1);
            }
        }

        editCanvas.addEventListener('mousedown', (e) => { isDrawing = true; drawOnEditor(e); });
        editCanvas.addEventListener('mousemove', (e) => { drawOnEditor(e); });
        editCanvas.addEventListener('mouseup', () => { isDrawing = false; });
        editCanvas.addEventListener('mouseleave', () => { isDrawing = false; });

        // --- SIMPAN HASIL EDIT KE MASTER & UPDATE UI ---
        function saveEdit() {
            if(!currentEditGlyph) return;

            // 1. Gambar ulang hasil edit ke Master Canvas di koordinat aslinya!
            mCtx.clearRect(currentEditGlyph.x, currentEditGlyph.y, currentEditGlyph.w, currentEditGlyph.h);
            mCtx.drawImage(editCanvas, currentEditGlyph.x, currentEditGlyph.y);

            // 2. Update gambar di Galeri HTML (Biar langsung kelihatan)
            const newDataUrl = editCanvas.toDataURL();
            currentEditGlyph.imgData = newDataUrl; // Update data
            document.getElementById(`img_${currentEditGlyph.id}`).src = newDataUrl;

            closeEditor();
        }

        // --- SISTEM EXPORT FULL SPRITESHEET ---
        function downloadMaster() {
            if(!isImageLoaded) return alert("Belum ada gambar yang di-load!");
            const link = document.createElement('a');
            link.download = 'custom_glyph_master.png';
            link.href = masterCanvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
