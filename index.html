<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eldoria Glyph Studio v5 (Ultimate Edition)</title>
    <style>
        :root {
            --bg-main: #18191c; --bg-panel: #2b2d31; --primary: #5865F2;
            --success: #23a559; --warning: #f0b232; --danger: #da373c;
            --text-main: #dbdee1; --border: #1e1f22;
        }

        body {
            background-color: var(--bg-main); color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center;
        }

        h1 { color: #fff; margin-top: 0; text-align: center; font-size: 1.5rem; }

        .toolbar {
            background: var(--bg-panel); padding: 15px; border-radius: 8px;
            display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 20px; width: 100%; max-width: 1200px;
            box-sizing: border-box;
        }

        .input-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 120px; }
        label { font-size: 11px; color: #aaa; font-weight: bold; }
        
        input[type="file"], input[type="text"], input[type="number"], select {
            background: var(--border); border: 1px solid #444; color: white;
            padding: 10px; border-radius: 4px; font-family: monospace; width: 100%; box-sizing: border-box;
        }
        
        button {
            background: var(--primary); color: white; border: none; box-sizing: border-box;
            padding: 10px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        button:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-success { background: var(--success); }
        .btn-warning { background: var(--warning); color: black; }
        .btn-danger { background: var(--danger); }
        .btn-block { width: 100%; padding: 12px; font-size: 14px; }

        .workspace {
            display: grid; grid-template-columns: 1fr 2.5fr; gap: 20px;
            width: 100%; max-width: 1200px; box-sizing: border-box;
        }

        .master-viewer {
            background: var(--bg-panel); padding: 15px; border-radius: 8px;
            display: flex; flex-direction: column; align-items: center; width: 100%; box-sizing: border-box;
        }
        
        .canvas-wrapper {
            width: 100%; max-width: 350px; aspect-ratio: 1/1; background: #000;
            overflow: hidden; border: 2px solid var(--border); border-radius: 4px; position: relative;
            background-image: linear-gradient(45deg, #222 25%, transparent 25%), linear-gradient(-45deg, #222 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #222 75%), linear-gradient(-45deg, transparent 75%, #222 75%);
            background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        
        #masterCanvas, #editCanvas { width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; }

        .glyph-gallery {
            background: var(--bg-panel); padding: 15px; border-radius: 8px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px; max-height: 700px; overflow-y: auto; align-content: start; box-sizing: border-box;
        }

        .glyph-card {
            background: var(--bg-main); border: 1px solid #444; border-radius: 6px;
            padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        
        .glyph-img {
            width: 64px; height: 64px; background: #000; image-rendering: pixelated;
            border: 1px dashed #555; background-image: linear-gradient(45deg, #222 25%, transparent 25%), linear-gradient(-45deg, #222 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #222 75%), linear-gradient(-45deg, transparent 75%, #222 75%);
            background-size: 10px 10px; background-position: 0 0, 0 5px, 5px -5px, -5px 0px;
        }

        .hex-code { font-family: monospace; font-size: 13px; font-weight: bold; color: var(--warning); }
        .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; width: 100%; }
        .card-actions button { font-size: 10px; padding: 5px; }

        /* MODAL EDITOR */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal {
            background: var(--bg-panel); padding: 20px; border-radius: 8px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; border: 2px solid var(--primary);
            max-width: 700px; width: 90%; max-height: 90vh; overflow-y: auto; box-sizing: border-box;
        }
        
        .editor-canvas-wrap {
            width: 100%; max-width: 300px; aspect-ratio: 1/1; border: 1px solid #555; margin: 0 auto;
            background-image: linear-gradient(45deg, #222 25%, transparent 25%), linear-gradient(-45deg, #222 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #222 75%), linear-gradient(-45deg, transparent 75%, #222 75%);
            background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px; cursor: crosshair;
        }

        .editor-tools { display: flex; flex-direction: column; gap: 15px; }
        
        .tool-box { background: var(--bg-main); padding: 12px; border-radius: 6px; border: 1px solid #444; }
        .tool-box h4 { margin: 0 0 10px 0; font-size: 13px; color: var(--gold-accent); }
        
        .flex-row { display: flex; gap: 10px; align-items: center; }
        input[type="range"] { width: 100%; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }

        @media (max-width: 850px) {
            .workspace { grid-template-columns: 1fr; }
            .modal { grid-template-columns: 1fr; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .input-group { min-width: 100%; }
        }
    </style>
</head>
<body>

    <h1>✨ Eldoria Glyph Studio v5</h1>

    <div class="toolbar">
        <div style="display: flex; gap: 10px; width: 100%;">
            <div class="input-group" style="flex: 2;">
                <label>1. Upload Sprite (960x960 PNG):</label>
                <input type="file" id="uploadFile" accept="image/png">
            </div>
            <div class="input-group" style="flex: 1; justify-content: flex-end;">
                <button class="btn-warning btn-block" onclick="createEmptyCanvas()">✨ BUAT KANVAS KOSONG</button>
            </div>
        </div>

        <div style="display: flex; gap: 10px; width: 100%;">
            <div class="input-group">
                <label>Kolom (X):</label>
                <input type="number" id="gridCols" value="16">
            </div>
            <div class="input-group">
                <label>Baris (Y):</label>
                <input type="number" id="gridRows" value="16">
            </div>
            <div class="input-group">
                <label>Base Hex:</label>
                <input type="text" id="baseHex" value="E100">
            </div>
        </div>
        <button class="btn-success btn-block" onclick="processGlyphs()">⚙️ PISAHKAN GLYPH</button>
    </div>

    <div class="workspace">
        <div class="master-viewer">
            <h3 style="margin-top:0;">🗺️ Master Spritesheet</h3>
            <div class="canvas-wrapper">
                <canvas id="masterCanvas"></canvas>
            </div>
            <button class="btn-success btn-block" style="margin-top: 15px;" onclick="downloadMaster()">⬇️ EXPORT SEMUA (MASTER PNG)</button>
        </div>

        <div class="glyph-gallery" id="galleryContainer">
            <div style="grid-column: 1 / -1; text-align: center; color: #777; padding: 50px 0;">
                Silakan upload gambar ATAU klik "Buat Kanvas Kosong", lalu klik "Pisahkan Glyph"
            </div>
        </div>
    </div>

    <!-- MODAL EDITOR PIXEL -->
    <div class="modal-overlay" id="editorModal">
        <div class="modal">
            <!-- Sisi Kiri: Canvas -->
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <h3 style="margin: 0; color: var(--warning); text-align: center;" id="editTitle">✏️ Edit Glyph</h3>
                <div class="editor-canvas-wrap">
                    <canvas id="editCanvas"></canvas>
                </div>
                <div class="flex-row">
                    <button style="flex: 1; background: #555;" onclick="closeEditor()">❌ Batal</button>
                    <button class="btn-success" style="flex: 1;" onclick="saveEdit()">💾 Simpan & Tutup</button>
                </div>
            </div>

            <!-- Sisi Kanan: Tools -->
            <div class="editor-tools">
                
                <!-- Tool: Template Eldoria Mini (Kotak-kotak) -->
                <div class="tool-box">
                    <h4 style="color: #faa61a;">🛡️ Base Template</h4>
                    <div class="input-group" style="margin-bottom: 5px;">
                        <label>Warna Rank:</label>
                        <select id="rankTemplate">
                            <option value="#E74C3C">Admin (Merah)</option>
                            <option value="#F1C40F">Owner (Emas)</option>
                            <option value="#408ECA">Celestora (Biru)</option>
                            <option value="#2E9C8A">Platinex (Tosca)</option>
                            <option value="#9B5DA2">Crystalon (Ungu)</option>
                            <option value="#D2D8D8">Silverlight (Perak)</option>
                            <option value="#D34235">Mythoria (Merah YouTube)</option>
                            <option value="#8E9E9B">Novaria (Hijau Pudar)</option>
                            <option value="#A6B1B0">Ironveil (Besi/Abu)</option>
                            <option value="#E0901A">Divinexus (Oranye Matahari)</option>
                            <option value="#C65C10">Eternalis (Oranye Api)</option>
                            <option value="#2ECC71">Emerald (Hijau Terang)</option>
                            <option value="#9B59B6">Amethyst (Pink Keunguan)</option>
                            <option value="#2980B9">Sapphire (Biru Tua)</option>
                            <option value="#34495E">Obsidian (Hitam/Abu Tua)</option>
                            <option value="#00FFFF">Diamond (Cyan)</option>
                            <option value="#FF1493">Neon (Pink Terang)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Logo Icon (Kiri):</label>
                        <select id="iconTemplate">
                            <option value="none">❌ Kosong</option>
                            <option value="crown">👑 Mahkota (Owner)</option>
                            <option value="skull">💀 Tengkorak (Admin)</option>
                            <option value="youtube">▶️ YouTube (Mythoria)</option>
                            <option value="star">⭐ Bintang (Celestora)</option>
                            <option value="gem">💎 Permata (Platinex)</option>
                            <option value="coin">🪙 Koin (Goldhaven)</option>
                            <option value="shield">🛡️ Perisai (Silverlight)</option>
                            <option value="sword">⚔️ Pedang (Ironveil)</option>
                            <option value="leaf">🍃 Daun (Novaria)</option>
                            <option value="heart">❤️ Hati (Nyawa)</option>
                            <option value="lightning">⚡ Petir (Speed)</option>
                            <option value="check">✔️ Centang (Sukses)</option>
                            <option value="cross">❌ Silang (Gagal)</option>
                            <option value="key">🔑 Kunci (Crate)</option>
                            <option value="pickaxe">⛏️ Beliung (Miner)</option>
                            <option value="discord">💬 Discord</option>
                        </select>
                    </div>
                    <button class="btn-warning btn-block" style="margin-top: 10px;" onclick="applyTemplate()">TERAPKAN TEPAT DI TENGAH</button>
                </div>

                <!-- Tool: Custom Text -->
                <div class="tool-box">
                    <h4 style="color: #23a559;">🔤 Teks 1-Px (Custom Engine)</h4>
                    <input type="text" id="customText" placeholder="Ketik text (Misal: ADMIN)" oninput="previewEditor()">
                    
                    <div class="input-group" style="margin-top: 5px;">
                        <select id="fontStyle" onchange="previewEditor()">
                            <option value="regular">Font: Minecraft Regular</option>
                            <option value="bold">Font: Minecraft Ten (Tebal)</option>
                        </select>
                    </div>

                    <div class="flex-row" style="margin-top: 5px; margin-bottom: 5px;">
                        <label style="color: white; font-size: 13px; display: flex; align-items: center; gap: 5px; cursor: pointer;">
                            <input type="checkbox" id="useShadow" checked onchange="previewEditor()" style="width: auto;"> Pakai Shadow Gelap
                        </label>
                    </div>

                    <div class="input-group">
                        <label>Geser Kiri/Kanan (X):</label>
                        <input type="range" id="textX" min="-10" max="60" value="26" oninput="previewEditor()">
                    </div>
                    <div class="input-group">
                        <label>Geser Atas/Bawah (Y):</label>
                        <input type="range" id="textY" min="-10" max="60" value="28" oninput="previewEditor()">
                    </div>
                    <div class="flex-row" style="margin-top: 10px;">
                        <input type="color" id="textColor" value="#ffffff" style="height: 35px; cursor:pointer; width: 50px; padding: 0;" oninput="previewEditor()">
                        <button class="btn-success" style="flex:1;" onclick="stampText()">✅ Bakar Teks!</button>
                    </div>
                </div>

                <!-- Tool: Draw/Hapus Manual -->
                <div class="tool-box">
                    <h4 style="color: #fff;">🖌️ Koreksi Manual</h4>
                    <div class="flex-row">
                        <input type="color" id="brushColor" value="#ffffff" style="height: 35px; cursor:pointer; width: 50px; padding: 0;">
                        <button id="btnBrush" style="flex:1;" onclick="setTool('brush')">Brush</button>
                        <button id="btnEraser" style="flex:1; background: var(--border);" onclick="setTool('eraser')">Eraser</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        const masterCanvas = document.getElementById('masterCanvas');
        const mCtx = masterCanvas.getContext('2d', { willReadFrequently: true });
        
        const editCanvas = document.getElementById('editCanvas');
        const eCtx = editCanvas.getContext('2d', { willReadFrequently: true });
        eCtx.imageSmoothingEnabled = false;

        const gallery = document.getElementById('galleryContainer');
        
        let mainImage = new Image();
        let glyphDataList = []; 
        let isImageLoaded = false;

        // Custom Font 1-Pixel 
        const pixelFont = {
            'A': ["010","101","111","101","101"], 'B': ["110","101","110","101","110"],
            'C': ["011","100","100","100","011"], 'D': ["110","101","101","101","110"],
            'E': ["111","100","111","100","111"], 'F': ["111","100","110","100","100"],
            'G': ["011","100","101","101","011"], 'H': ["101","101","111","101","101"],
            'I': ["111","010","010","010","111"], 'J': ["001","001","001","101","010"],
            'K': ["101","101","110","101","101"], 'L': ["100","100","100","100","111"],
            'M': ["10001","11011","10101","10001","10001"], 'N': ["1001","1101","1011","1001","1001"],
            'O': ["010","101","101","101","010"], 'P': ["110","101","110","100","100"],
            'Q': ["010","101","101","011","001"], 'R': ["110","101","110","101","101"],
            'S': ["011","100","010","001","110"], 'T': ["111","010","010","010","010"],
            'U': ["101","101","101","101","011"], 'V': ["101","101","101","101","010"],
            'W': ["10001","10001","10101","11011","10001"], 'X': ["101","101","010","101","101"],
            'Y': ["101","101","010","010","010"], 'Z': ["111","001","010","100","111"],
            '1': ["010","110","010","010","111"], '2': ["010","101","001","010","111"],
            '3': ["110","001","010","001","110"], '0': ["010","101","101","101","010"]
        };

        const icons = {
            crown: ["00000000","10000010","11000110","10101010","11111110","11111110"],
            skull: ["011110","111111","101101","111111","010010"],
            youtube: ["01111110","11111111","11110111","11111011","11110111","11111111","01111110"],
            sword: ["00001","00011","01110","11100","01000"],
            shield: ["111111","100001","100001","010010","001100"],
            gem: ["011110","111111","011110","001100"],
            crystal: ["00100","01110","11111","01110","00100"],
            flame: ["00100","01100","11110","11111","01110"],
            star: ["00100","01110","11111","01110","10001"],
            sun: ["10101","01110","11111","01110","10101"],
            coin: ["01110","11111","11011","11111","01110"],
            leaf: ["0010","0110","1111","0110","0010"],
            heart: ["01010","11111","11111","01110","00100"],
            lightning: ["00110","01100","11111","00110","00100","01000"],
            check: ["000001","000011","100110","111100","011000"],
            cross: ["10001","01010","00100","01010","10001"],
            key: ["01100","10100","01110","00011","00001"],
            pickaxe: ["11111","00100","00100","01000","10000"],
            discord: ["0110110","1111111","1011101","1111111","0100010"]
        };

        // Shade Color
        function shadeColor(color, percent) {
            let R = parseInt(color.substring(1,3),16); let G = parseInt(color.substring(3,5),16); let B = parseInt(color.substring(5,7),16);
            R = parseInt(R * (100 + percent) / 100); G = parseInt(G * (100 + percent) / 100); B = parseInt(B * (100 + percent) / 100);
            R = (R<255)?R:255; G = (G<255)?G:255; B = (B<255)?B:255; R = (R>0)?R:0; G = (G>0)?G:0; B = (B>0)?B:0;
            return "#"+((R.toString(16).length==1)?"0"+R.toString(16):R.toString(16))+((G.toString(16).length==1)?"0"+G.toString(16):G.toString(16))+((B.toString(16).length==1)?"0"+B.toString(16):B.toString(16));
        }

        // TOUCH/MOUSE COORDINATES
        function getCoords(e, canvasElem) {
            const rect = canvasElem.getBoundingClientRect();
            const scaleX = canvasElem.width / rect.width;
            const scaleY = canvasElem.height / rect.height;
            let clientX = e.clientX; let clientY = e.clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX; clientY = e.touches[0].clientY;
            }
            return { x: Math.floor((clientX - rect.left) * scaleX), y: Math.floor((clientY - rect.top) * scaleY) };
        }

        // --- SISTEM BUAT KANVAS KOSONG DARI AWAL ---
        function createEmptyCanvas() {
            masterCanvas.width = 960;
            masterCanvas.height = 960;
            mCtx.clearRect(0, 0, 960, 960);
            isImageLoaded = true;
            
            // Otomatis jalankan pemisahan glyph
            document.getElementById('gridCols').value = 16;
            document.getElementById('gridRows').value = 16;
            processGlyphs();
        }

        document.getElementById('uploadFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                mainImage.onload = () => {
                    masterCanvas.width = mainImage.width; masterCanvas.height = mainImage.height;
                    mCtx.clearRect(0,0, masterCanvas.width, masterCanvas.height);
                    mCtx.drawImage(mainImage, 0, 0);
                    isImageLoaded = true;
                }
                mainImage.src = ev.target.result;
            }
            reader.readAsDataURL(file);
        });

        function processGlyphs() {
            if(!isImageLoaded) return alert("Upload gambar atau klik Buat Kanvas Kosong dulu!");
            const cols = parseInt(document.getElementById('gridCols').value);
            const rows = parseInt(document.getElementById('gridRows').value);
            const baseHexNum = parseInt(document.getElementById('baseHex').value, 16);
            const cellW = masterCanvas.width / cols; const cellH = masterCanvas.height / rows;

            glyphDataList = []; gallery.innerHTML = ''; 

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = cellW; tempCanvas.height = cellH;
            const tCtx = tempCanvas.getContext('2d');

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const currentHex = (baseHexNum + (r * cols) + c).toString(16).toUpperCase();
                    const x = c * cellW; const y = r * cellH;

                    tCtx.clearRect(0, 0, cellW, cellH);
                    tCtx.drawImage(masterCanvas, x, y, cellW, cellH, 0, 0, cellW, cellH);
                    
                    const glyphObj = {
                        id: `glyph_${c}_${r}`, col: c, row: r, x: x, y: y, w: cellW, h: cellH,
                        hex: currentHex, imgData: tempCanvas.toDataURL()
                    };
                    glyphDataList.push(glyphObj);
                    createGlyphCard(glyphObj);
                }
            }
        }

        function createGlyphCard(glyph) {
            const card = document.createElement('div');
            card.className = 'glyph-card';
            card.innerHTML = `
                <img src="${glyph.imgData}" class="glyph-img" id="img_${glyph.id}">
                <div class="hex-code">\\u${glyph.hex}</div>
                <div class="card-actions">
                    <button onclick="copyHex('${glyph.hex}', this)">📋 Copy</button>
                    <button class="btn-warning" onclick="openEditor('${glyph.id}')">✏️ Edit</button>
                    <button style="grid-column: span 2;" class="btn-success" onclick="downloadSingle('${glyph.id}')">⬇️ DL 1 Gambar</button>
                </div>
            `;
            gallery.appendChild(card);
        }

        function copyHex(hex, btn) {
            navigator.clipboard.writeText(`\\u${hex}`).then(() => {
                const ori = btn.innerHTML; btn.innerHTML = "✅"; btn.style.background = "var(--success)";
                setTimeout(() => { btn.innerHTML = ori; btn.style.background = ""; }, 1000);
            });
        }

        function downloadSingle(id) {
            const glyph = glyphDataList.find(g => g.id === id);
            const link = document.createElement('a');
            link.download = `glyph_${glyph.hex}.png`;
            link.href = document.getElementById(`img_${id}`).src;
            link.click();
        }

        // --- EDITOR SYSTEM ---
        let currentEditGlyph = null;
        let isDrawing = false;
        let activeTool = 'brush'; 
        let baseEditorCanvas = document.createElement('canvas'); 
        let baseCtx = baseEditorCanvas.getContext('2d', { willReadFrequently: true });

        function openEditor(glyphId) {
            currentEditGlyph = glyphDataList.find(g => g.id === glyphId);
            if(!currentEditGlyph) return;

            document.getElementById('editTitle').innerText = `✏️ Edit \\u${currentEditGlyph.hex}`;
            editCanvas.width = currentEditGlyph.w; editCanvas.height = currentEditGlyph.h;
            baseEditorCanvas.width = currentEditGlyph.w; baseEditorCanvas.height = currentEditGlyph.h;
            
            document.getElementById('textX').max = currentEditGlyph.w + 10;
            document.getElementById('textY').max = currentEditGlyph.h + 10;
            
            document.getElementById('textX').value = Math.floor(currentEditGlyph.w / 2) - 4;
            document.getElementById('textY').value = Math.floor(currentEditGlyph.h / 2) - 2;

            document.getElementById('customText').value = ""; 

            baseCtx.clearRect(0,0, editCanvas.width, editCanvas.height);
            baseCtx.drawImage(masterCanvas, currentEditGlyph.x, currentEditGlyph.y, currentEditGlyph.w, currentEditGlyph.h, 0, 0, currentEditGlyph.w, currentEditGlyph.h);

            previewEditor(); 
            document.getElementById('editorModal').style.display = 'flex';
            setTool('brush');
        }

        function closeEditor() { document.getElementById('editorModal').style.display = 'none'; currentEditGlyph = null; }

        function setTool(tool) {
            activeTool = tool;
            document.getElementById('btnBrush').style.background = tool === 'brush' ? 'var(--primary)' : 'var(--border)';
            document.getElementById('btnEraser').style.background = tool === 'eraser' ? 'var(--danger)' : 'var(--border)';
        }

        function hexToRgba(hex) {
            return `rgba(${parseInt(hex.slice(1, 3), 16)}, ${parseInt(hex.slice(3, 5), 16)}, ${parseInt(hex.slice(5, 7), 16)}, 1)`;
        }

        // --- SISTEM FONT TERBARU (Shadow & Tebal) ---
        function previewEditor() {
            eCtx.clearRect(0,0, editCanvas.width, editCanvas.height);
            eCtx.drawImage(baseEditorCanvas, 0, 0); 

            const txt = document.getElementById('customText').value;
            if(txt.length > 0) {
                const tx = parseInt(document.getElementById('textX').value);
                const ty = parseInt(document.getElementById('textY').value);
                const tCol = document.getElementById('textColor').value;
                const fontStyle = document.getElementById('fontStyle').value;
                const useShadow = document.getElementById('useShadow').checked;

                // Fungsi cetak layer text
                const drawTextLayer = (offsetX, offsetY, color) => {
                    let cursorX = tx + offsetX;
                    for(let i=0; i<txt.length; i++) {
                        let char = txt[i].toUpperCase();
                        let charMap = pixelFont[char];
                        if(charMap) {
                            for(let row=0; row<charMap.length; row++) {
                                for(let col=0; col<charMap[row].length; col++) {
                                    if(charMap[row][col] === '1') {
                                        eCtx.fillStyle = color;
                                        eCtx.fillRect(cursorX + col, ty + offsetY + row, 1, 1);
                                        // Kalau Minceraft Ten (Bold), tambahin pixel ke samping
                                        if(fontStyle === 'bold') {
                                            eCtx.fillRect(cursorX + col + 1, ty + offsetY + row, 1, 1);
                                        }
                                    }
                                }
                            }
                            // Spasi antar huruf beda kalau bold
                            cursorX += charMap[0].length + (fontStyle === 'bold' ? 2 : 1);
                        } else if (char === ' ') {
                            cursorX += (fontStyle === 'bold' ? 4 : 3);
                        }
                    }
                };

                // Gambar Shadow Dulu (Kalau Dicentang)
                if (useShadow) {
                    drawTextLayer(1, 1, '#222222'); // Warna hitam gelap buat shadow
                }
                
                // Baru gambar Text Utama
                drawTextLayer(0, 0, tCol);
            }
        }

        function stampText() {
            baseCtx.clearRect(0,0, baseEditorCanvas.width, baseEditorCanvas.height);
            baseCtx.drawImage(editCanvas, 0, 0); 
            document.getElementById('customText').value = ""; 
            previewEditor();
        }

        function handleDrawStart(e) { if(!currentEditGlyph) return; isDrawing = true; processDrawing(e); }
        function handleDrawMove(e) { if (!isDrawing) return; e.preventDefault(); processDrawing(e); }
        function handleDrawEnd() { isDrawing = false; }

        function processDrawing(e) {
            const pos = getCoords(e, editCanvas);
            if (activeTool === 'eraser') {
                baseCtx.clearRect(pos.x, pos.y, 1, 1);
            } else {
                baseCtx.fillStyle = hexToRgba(document.getElementById('brushColor').value);
                baseCtx.clearRect(pos.x, pos.y, 1, 1); baseCtx.fillRect(pos.x, pos.y, 1, 1);
            }
            previewEditor();
        }

        editCanvas.addEventListener('mousedown', handleDrawStart);
        editCanvas.addEventListener('mousemove', handleDrawMove);
        editCanvas.addEventListener('mouseup', handleDrawEnd);
        editCanvas.addEventListener('mouseleave', handleDrawEnd);
        
        editCanvas.addEventListener('touchstart', handleDrawStart, {passive: false});
        editCanvas.addEventListener('touchmove', handleDrawMove, {passive: false});
        editCanvas.addEventListener('touchend', handleDrawEnd);

        // BORDER & TEMPLATE ENGINE
        function applyTemplate() {
            const baseColor = document.getElementById('rankTemplate').value;
            const w = editCanvas.width;
            const h = editCanvas.height;

            const cTop = shadeColor(baseColor, 5); const cMid = shadeColor(baseColor, -20); const cBot = shadeColor(baseColor, -40);
            const cBorderLight = shadeColor(baseColor, 70); const cBorderDark = shadeColor(baseColor, -15);

            baseCtx.clearRect(0, 0, w, h);

            const badgeH = 14; const iconW = 14; const gap = 1; const textW = 42; 
            const badgeW = iconW + gap + textW; 

            const startX = Math.floor((w - badgeW) / 2);
            const startY = Math.floor((h - badgeH) / 2);

            function drawSmallBox(bx, by, bw, bh) {
                const segment = Math.floor((bh - 2) / 3);
                baseCtx.fillStyle = cTop; baseCtx.fillRect(bx + 1, by + 1, bw - 2, segment);
                baseCtx.fillStyle = cMid; baseCtx.fillRect(bx + 1, by + 1 + segment, bw - 2, bh - 2 - (segment * 2));
                baseCtx.fillStyle = cBot; baseCtx.fillRect(bx + 1, by + bh - 1 - segment, bw - 2, segment);

                baseCtx.fillStyle = cBorderLight; baseCtx.fillRect(bx, by, bw - 1, 1); baseCtx.fillRect(bx, by, 1, bh - 1);
                baseCtx.fillStyle = cBorderDark; baseCtx.fillRect(bx, by + bh - 1, bw, 1); baseCtx.fillRect(bx + bw - 1, by, 1, bh);
            }

            drawSmallBox(startX, startY, iconW, badgeH);
            drawSmallBox(startX + iconW + gap, startY, textW, badgeH);

            const iconName = document.getElementById('iconTemplate').value;
            if (iconName !== 'none' && icons[iconName]) {
                const iconMatrix = icons[iconName];
                const iH = iconMatrix.length; const iW = iconMatrix[0].length;
                const ix = startX + Math.floor((iconW - iW) / 2); const iy = startY + Math.floor((badgeH - iH) / 2);

                for (let r = 0; r < iH; r++) {
                    for (let c = 0; c < iW; c++) {
                        if (iconMatrix[r][c] === '1') {
                            baseCtx.fillStyle = '#ffffff'; baseCtx.fillRect(ix + c, iy + r, 1, 1);
                        }
                    }
                }
            }
            previewEditor();
        }

        function saveEdit() {
            if(!currentEditGlyph) return;
            mCtx.clearRect(currentEditGlyph.x, currentEditGlyph.y, currentEditGlyph.w, currentEditGlyph.h);
            mCtx.drawImage(editCanvas, currentEditGlyph.x, currentEditGlyph.y);

            const newDataUrl = editCanvas.toDataURL();
            currentEditGlyph.imgData = newDataUrl;
            document.getElementById(`img_${currentEditGlyph.id}`).src = newDataUrl;
            closeEditor();
        }

        function downloadMaster() {
            if(!isImageLoaded) return alert("Belum ada gambar!");
            const link = document.createElement('a'); link.download = 'master_glyph_edited.png';
            link.href = masterCanvas.toDataURL('image/png'); link.click();
        }
    </script>
</body>
