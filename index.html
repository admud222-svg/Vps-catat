<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Glyph Generator - Eldoria</title>
    <style>
        body {
            background-color: #2c2f33;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1, h3 { margin-top: 0; margin-bottom: 10px; text-align: center; }
        .panel {
            background: #23272a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 10px;
        }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        input[type="number"], input[type="color"], input[type="range"], select {
            padding: 7px;
            border: 1px solid #7289da;
            border-radius: 4px;
            background: #2c2f33;
            color: white;
            font-weight: bold;
        }
        button {
            background-color: #7289da;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background-color: #5b6eae; }
        .btn-template { background-color: #43b581; }
        .btn-template:hover { background-color: #3ca374; }
        .btn-download { background-color: #faa61a; font-size: 16px; padding: 10px 20px; }
        .btn-download:hover { background-color: #e09619; }

        .canvas-container {
            background-image: 
                linear-gradient(45deg, #808080 25%, transparent 25%), 
                linear-gradient(-45deg, #808080 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #808080 75%), 
                linear-gradient(-45deg, transparent 75%, #808080 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            border: 2px solid #7289da;
            border-radius: 4px;
            width: 320px; 
            height: 320px;
            cursor: crosshair;
            margin: 0 auto 20px auto;
        }

        canvas {
            width: 100%;
            height: 100%;
            /* Anti-blur untuk preview browser */
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>

    <h1>✨ UI & Glyph Generator Eldoria</h1>

    <div class="panel" style="border: 2px solid #faa61a;">
        <h3 style="color: #faa61a;">🛡️ Pembuat Rank Badge (Khusus Glyph)</h3>
        <p style="text-align:center; font-size:12px; margin-top:-5px; color:#ccc;">
            Anti-blur! Ukuran canvas tetap 83x83, tapi gambar di-scale tebal dan diberi jarak aman (padding).
        </p>
        <div class="controls">
            <div class="control-group" style="width: 200px;">
                <label>Pilih Rank Eldoria:</label>
                <select id="rankSelect">
                    <option value="NOVARIA">NOVARIA</option>
                    <option value="IRONVEIL">IRONVEIL</option>
                    <option value="SILVERLIGHT">SILVERLIGHT</option>
                    <option value="GOLDHAVEN">GOLDHAVEN</option>
                    <option value="PLATINEX">PLATINEX</option>
                    <option value="CRYSTALON">CRYSTALON</option>
                    <option value="MYTHORIA">MYTHORIA</option>
                    <option value="ETERNALIS">ETERNALIS</option>
                    <option value="CELESTORA">CELESTORA</option>
                    <option value="DIVINEXUS">DIVINEXUS</option>
                    <option value="ADMIN">ADMIN</option>
                    <option value="OWNER">OWNER</option>
                </select>
            </div>
            <div class="control-group" style="justify-content: flex-end;">
                <button class="btn-template" onclick="generateRankBadge()">Buat Rank Glyph</button>
            </div>
        </div>
    </div>

    <!-- CANVAS PREVIEW -->
    <div class="canvas-container">
        <canvas id="pixelCanvas" width="83" height="83"></canvas>
    </div>

    <button class="btn-download" onclick="downloadImage()">⬇️ Download Hasil PNG</button>

    <script>
        const canvas = document.getElementById('pixelCanvas');
        const ctx = canvas.getContext('2d');
        
        // Mematikan anti-aliasing di kanvas supaya font dan kotak benar-benar tajam
        ctx.imageSmoothingEnabled = false;

        const rankData = {
            "NOVARIA":     { c1: "#BFC9CA", c2: "#7F8C8D", icon: "leaf" },
            "IRONVEIL":    { c1: "#D5DBDB", c2: "#839192", icon: "sword" },
            "SILVERLIGHT": { c1: "#FDFEFE", c2: "#BDC3C7", icon: "shield" },
            "GOLDHAVEN":   { c1: "#F1C40F", c2: "#B9770E", icon: "coin" },
            "PLATINEX":    { c1: "#48C9B0", c2: "#117A65", icon: "gem" },
            "CRYSTALON":   { c1: "#D2B4DE", c2: "#8E44AD", icon: "crystal" },
            "MYTHORIA":    { c1: "#F1948A", c2: "#C0392B", icon: "youtube" },
            "ETERNALIS":   { c1: "#E67E22", c2: "#A04000", icon: "flame" },
            "CELESTORA":   { c1: "#85C1E9", c2: "#2874A6", icon: "star" },
            "DIVINEXUS":   { c1: "#F8C471", c2: "#D68910", icon: "sun" },
            "ADMIN":       { c1: "#E74C3C", c2: "#7B241C", icon: "skull" },
            "OWNER":       { c1: "#F7DC6F", c2: "#17202A", icon: "crown" }
        };

        const icons = {
            crown: ["1000001","1100011","1010101","1111111","1111111"],
            skull: ["011110","111111","101101","111111","010010"],
            youtube: ["0111110","1111111","1110111","1111011","1110111","1111111","0111110"],
            sword: ["00001","00011","01110","11100","01000"],
            shield: ["111111","100001","100001","010010","001100"],
            gem: ["011110","111111","011110","001100"],
            crystal: ["00100","01110","11111","01110","00100"],
            flame: ["00100","01100","11110","11111","01110"],
            star: ["00100","01110","11111","01110","10001"],
            sun: ["10101","01110","11111","01110","10101"],
            coin: ["01110","11111","11011","11111","01110"],
            leaf: ["0010","0110","1111","0110","0010"]
        };

        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        function generateRankBadge() {
            clearCanvas();
            
            const rankName = document.getElementById('rankSelect').value;
            const data = rankData[rankName];

            // Trik Supaya Gak Blur:
            // 1. Skala dibesarkan (1 pixel logis = 2 pixel layar)
            // 2. Padding/jarak aman di sekelilingnya
            const pSize = 2; // Pixel Size (ketebalan)
            
            // Lebar total elemen: Icon box (10) + spasi (1) + Text box (27) = 38 blok.
            // 38 blok * 2 (pSize) = 76 pixel fisik.
            // Sisa dari 83 pixel adalah 7. Jadi kita punya padding 3.5 pixel di kiri & kanan! Aman!
            const badgeW = 38 * pSize; 
            const badgeH = 10 * pSize; 

            // Center position (Jarak aman)
            const offsetX = Math.floor((83 - badgeW) / 2); 
            const offsetY = Math.floor((83 - badgeH) / 2);

            // --- 1. GAMBAR BORDER PUTIH ---
            ctx.fillStyle = "#ffffff";
            // Kotak Kiri (Background Icon) -> Lebar 10 blok
            ctx.fillRect(offsetX, offsetY, 10 * pSize, badgeH); 
            // Kotak Kanan (Background Teks) -> Lebar 27 blok
            ctx.fillRect(offsetX + 11 * pSize, offsetY, 27 * pSize, badgeH); 

            // --- 2. ISI WARNA DALAM (Tanpa Gradasi Smooth, pakai warna Solid Hard-edge) ---
            // Kotak Kiri
            ctx.fillStyle = data.c1; // Warna atas
            ctx.fillRect(offsetX + 1*pSize, offsetY + 1*pSize, 8*pSize, 4*pSize);
            ctx.fillStyle = data.c2; // Warna bawah
            ctx.fillRect(offsetX + 1*pSize, offsetY + 5*pSize, 8*pSize, 4*pSize);

            // Kotak Kanan
            ctx.fillStyle = data.c1;
            ctx.fillRect(offsetX + 12*pSize, offsetY + 1*pSize, 25*pSize, 4*pSize);
            ctx.fillStyle = data.c2;
            ctx.fillRect(offsetX + 12*pSize, offsetY + 5*pSize, 25*pSize, 4*pSize);

            // --- 3. GAMBAR ICON PIXEL ART ---
            const iconMatrix = icons[data.icon];
            if(iconMatrix) {
                const iW = iconMatrix[0].length;
                const iH = iconMatrix.length;
                // Center icon di dalam kotak 10x10 blok
                const oX = offsetX + Math.floor((10 - iW) / 2) * pSize; 
                const oY = offsetY + Math.floor((10 - iH) / 2) * pSize;

                for(let r = 0; r < iH; r++) {
                    for(let c = 0; c < iW; c++) {
                        if(iconMatrix[r][c] === '1') {
                            // Shadow hitam solid (Hard edge)
                            ctx.fillStyle = "#111111";
                            ctx.fillRect(oX + (c * pSize) + pSize, oY + (r * pSize) + pSize, pSize, pSize);
                            // Warna putih icon
                            ctx.fillStyle = "#ffffff";
                            ctx.fillRect(oX + (c * pSize), oY + (r * pSize), pSize, pSize);
                        }
                    }
                }
            }

            // --- 4. GAMBAR TEKS RANK ---
            // Pake font default tapi di-bold. Shadow bukan pakai trik blur, tapi digambar manual offsetnya
            ctx.font = "bold 13px 'Segoe UI', Arial, sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            
            // Center dari kotak teks (lebar 27 blok / 54 pixel)
            const textX = offsetX + (11 * pSize) + Math.floor((27 * pSize) / 2);
            const textY = offsetY + Math.floor((10 * pSize) / 2);

            // Bikin bayangan TEGAS tanpa bluring
            ctx.fillStyle = "#111111"; 
            ctx.fillText(rankName, textX + 1.5, textY + 1.5, 25 * pSize);
            
            // Teks putih
            ctx.fillStyle = "#ffffff";
            ctx.fillText(rankName, textX, textY, 25 * pSize); // maxWidth dilimit biar gak nabrak border
        }

        function downloadImage() {
            const link = document.createElement('a');
            const rankName = document.getElementById('rankSelect').value;
            link.download = `glyph_${rankName.toLowerCase()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        window.onload = () => { generateRankBadge(); };
    </script>
</body>
</html>
