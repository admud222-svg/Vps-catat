<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eldoria Rank Glyph Generator</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --border-color: #333;
            --accent: #007aff;
            --text-main: #f5f5f7;
            --text-muted: #86868b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }

        h2 {
            grid-column: 1 / -1;
            text-align: center;
            margin-top: 0;
            font-weight: 600;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .input-row {
            display: flex;
            gap: 1rem;
        }

        .input-row .input-group {
            flex: 1;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
        }

        input, select {
            padding: 0.75rem;
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }

        input[type="color"] {
            padding: 0;
            height: 40px;
            cursor: pointer;
        }

        .preview-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
            justify-content: flex-start;
        }

        .canvas-container {
            width: 100%;
            min-height: 200px;
            background-color: #2a2a2a;
            background-image: 
                linear-gradient(45deg, #333 25%, transparent 25%), 
                linear-gradient(-45deg, #333 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #333 75%), 
                linear-gradient(-45deg, transparent 75%, #333 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow: auto;
        }

        canvas {
            background-color: transparent;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .btn {
            width: 100%;
            padding: 0.8rem;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background-color: #005bb5;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Eldoria Rank Glyph Generator</h2>

    <div class="controls">
        <div class="input-group">
            <label>Template Rank (Preset)</label>
            <select id="rankPreset">
                <option value="none">-- Pilih Rank Eldoria --</option>
                <option value="NOVARIA" data-color="#B0BEC5" data-bg="#263238">NOVARIA</option>
                <option value="IRONVEIL" data-color="#FFFFFF" data-bg="#607D8B">IRONVEIL</option>
                <option value="SILVERLIGHT" data-color="#E0E0E0" data-bg="#78909C">SILVERLIGHT</option>
                <option value="GOLDHAVEN" data-color="#FFD700" data-bg="#F57F17">GOLDHAVEN</option>
                <option value="PLATINEX" data-color="#81D4FA" data-bg="#0277BD">PLATINEX</option>
                <option value="CRYSTALON" data-color="#CE93D8" data-bg="#6A1B9A">CRYSTALON</option>
                <option value="MYTHORIA" data-color="#FF8A80" data-bg="#AD1457">MYTHORIA</option>
                <option value="ETERNALIS" data-color="#8C9EFF" data-bg="#1565C0">ETERNALIS</option>
                <option value="CELESTORA" data-color="#A7FFEB" data-bg="#00695C">CELESTORA</option>
                <option value="DIVINEXUS" data-color="#FF5252" data-bg="#B71C1C">DIVINEXUS</option>
                <option value="ADMIN" data-color="#FF0000" data-bg="#4A0000">ADMIN</option>
                <option value="OWNER" data-color="#AA0000" data-bg="#2B0000">OWNER</option>
            </select>
        </div>

        <div class="input-group">
            <label>Teks Glyph</label>
            <input type="text" id="glyphText" value="NOVARIA">
        </div>

        <div class="input-row">
            <div class="input-group">
                <label>Warna Teks</label>
                <input type="color" id="textColor" value="#B0BEC5">
            </div>
            <div class="input-group">
                <label>Warna Background</label>
                <input type="color" id="bgColor" value="#263238">
            </div>
        </div>

        <div class="input-row">
            <div class="input-group">
                <label>Lebar File (px)</label>
                <input type="number" id="canvasWidth" value="256">
            </div>
            <div class="input-group">
                <label>Tinggi File (px)</label>
                <input type="number" id="canvasHeight" value="64">
            </div>
        </div>

        <div class="input-group">
            <label>Upload Icon (Opsional, format PNG transparan)</label>
            <input type="file" id="iconUpload" accept="image/png, image/jpeg">
        </div>
    </div>

    <div class="preview-section">
        <div class="input-group" style="width: 100%; text-align: center;">
            <label>Preview Transparansi</label>
        </div>
        <div class="canvas-container">
            <canvas id="glyphCanvas"></canvas>
        </div>
        <button class="btn" onclick="downloadGlyph()">Download Glyph PNG</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('glyphCanvas');
    const ctx = canvas.getContext('2d');

    const inputs = {
        preset: document.getElementById('rankPreset'),
        text: document.getElementById('glyphText'),
        textColor: document.getElementById('textColor'),
        bgColor: document.getElementById('bgColor'),
        width: document.getElementById('canvasWidth'),
        height: document.getElementById('canvasHeight'),
        iconUpload: document.getElementById('iconUpload')
    };

    let uploadedIcon = null;

    function drawRoundRect(ctx, x, y, width, height, radius, fill, stroke) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
        if (fill) { ctx.fillStyle = fill; ctx.fill(); }
        if (stroke) { ctx.lineWidth = 2; ctx.strokeStyle = stroke; ctx.stroke(); }
    }

    function renderGlyph() {
        const width = parseInt(inputs.width.value) || 256;
        const height = parseInt(inputs.height.value) || 64;
        
        canvas.width = width;
        canvas.height = height;

        ctx.clearRect(0, 0, width, height);

        // Styling
        const text = inputs.text.value;
        const bgColor = inputs.bgColor.value;
        const textColor = inputs.textColor.value;
        
        // Setup font to measure text
        const fontSize = height * 0.5;
        ctx.font = `bold ${fontSize}px 'Minecraft', 'Segoe UI', sans-serif`;
        ctx.textBaseline = 'middle';
        
        let textWidth = ctx.measureText(text).width;
        let iconSize = 0;
        let gap = 0;

        if (uploadedIcon) {
            iconSize = height * 0.6;
            gap = 8;
        }

        const totalContentWidth = textWidth + iconSize + gap;
        const paddingX = 16;
        const bgWidth = totalContentWidth + (paddingX * 2);
        const bgHeight = height * 0.8;
        
        const startX = (width - bgWidth) / 2;
        const startY = (height - bgHeight) / 2;

        // Draw Background (Opacity 80% for modern game UI look)
        ctx.globalAlpha = 0.85;
        drawRoundRect(ctx, startX, startY, bgWidth, bgHeight, 8, bgColor, textColor);
        ctx.globalAlpha = 1.0;

        // Draw Icon if exists
        let currentX = startX + paddingX;
        if (uploadedIcon) {
            const iconY = (height - iconSize) / 2;
            ctx.drawImage(uploadedIcon, currentX, iconY, iconSize, iconSize);
            currentX += iconSize + gap;
        }

        // Draw Text
        ctx.fillStyle = textColor;
        // Simple drop shadow for Minecraft style
        ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 2;
        ctx.shadowBlur = 0;
        
        ctx.fillText(text, currentX, height / 2);
        
        // Reset shadow
        ctx.shadowColor = 'transparent';
    }

    // Event Listeners
    inputs.preset.addEventListener('change', (e) => {
        const selected = e.target.options[e.target.selectedIndex];
        if (selected.value !== "none") {
            inputs.text.value = selected.value;
            inputs.textColor.value = selected.getAttribute('data-color');
            inputs.bgColor.value = selected.getAttribute('data-bg');
            renderGlyph();
        }
    });

    [inputs.text, inputs.textColor, inputs.bgColor, inputs.width, inputs.height].forEach(input => {
        input.addEventListener('input', renderGlyph);
    });

    inputs.iconUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    uploadedIcon = img;
                    renderGlyph();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        } else {
            uploadedIcon = null;
            renderGlyph();
        }
    });

    function downloadGlyph() {
        const link = document.createElement('a');
        link.download = `glyph_${inputs.text.value.toLowerCase()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    // Initial render
    renderGlyph();
</script>

</body>
</html>
