<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Shine Generator</title>
    <style>
        body {
            background-color: #2c2f33;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 { margin-top: 0; }
        .controls {
            background: #23272a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        input[type="number"], input[type="color"], input[type="range"] {
            padding: 5px;
            border: 1px solid #7289da;
            border-radius: 4px;
            background: #2c2f33;
            color: white;
        }
        button {
            background-color: #7289da;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background-color: #5b6eae; }
        .btn-template { background-color: #43b581; }
        .btn-template:hover { background-color: #3ca374; }
        .btn-download { background-color: #faa61a; }
        .btn-download:hover { background-color: #e09619; }

        /* Container Canvas dengan background checkerboard transparan */
        .canvas-container {
            background-image: 
                linear-gradient(45deg, #808080 25%, transparent 25%), 
                linear-gradient(-45deg, #808080 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #808080 75%), 
                linear-gradient(-45deg, transparent 75%, #808080 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            border: 2px solid #7289da;
            border-radius: 4px;
            /* Ukuran display di layar diperbesar, tapi pixel aslinya tetap kecil */
            width: 320px; 
            height: 320px;
            cursor: crosshair;
        }

        canvas {
            width: 100%;
            height: 100%;
            /* Ini trik CSS supaya gambarnya kotak tajam (pixelated), bukan blur */
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>

    <h1>✨ Pixel Shine Generator</h1>

    <div class="controls">
        <div class="control-group">
            <label>Lebar (px)</label>
            <input type="number" id="widthInput" value="32" min="8" max="128">
        </div>
        <div class="control-group">
            <label>Tinggi (px)</label>
            <input type="number" id="heightInput" value="32" min="8" max="128">
        </div>
        <div class="control-group" style="justify-content: flex-end;">
            <button onclick="resizeCanvas()">Ubah Ukuran</button>
        </div>
        <div class="control-group">
            <label>Warna Brush</label>
            <input type="color" id="colorInput" value="#ffffff">
        </div>
        <div class="control-group">
            <label>Transparansi (Opacity)</label>
            <input type="range" id="opacityInput" min="0.1" max="1" step="0.1" value="1">
        </div>
        <div class="control-group" style="justify-content: flex-end;">
            <button onclick="setEraser()" style="background:#f04747;">Penghapus</button>
        </div>
    </div>

    <div class="controls">
        <button class="btn-template" onclick="loadTemplate()">Load Template Shine Diagonal</button>
        <button class="btn-template" onclick="clearCanvas()" style="background:#f04747;">Bersihkan Kanvas</button>
        <button class="btn-download" onclick="downloadImage()">⬇️ Download PNG</button>
    </div>

    <div class="canvas-container">
        <canvas id="pixelCanvas" width="32" height="32"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('pixelCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let isEraser = false;

        function resizeCanvas() {
            const w = document.getElementById('widthInput').value;
            const h = document.getElementById('heightInput').value;
            canvas.width = w;
            canvas.height = h;
            clearCanvas();
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function setEraser() {
            isEraser = true;
        }

        function hexToRgba(hex, opacity) {
            let r = parseInt(hex.slice(1, 3), 16);
            let g = parseInt(hex.slice(3, 5), 16);
            let b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${opacity})`;
        }

        function drawPixel(e) {
            const rect = canvas.getBoundingClientRect();
            // Menghitung posisi mouse dikonversi ke koordinat pixel asli
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = Math.floor((e.clientX - rect.left) * scaleX);
            const y = Math.floor((e.clientY - rect.top) * scaleY);

            if (isEraser) {
                ctx.clearRect(x, y, 1, 1);
            } else {
                const hexColor = document.getElementById('colorInput').value;
                const opacity = document.getElementById('opacityInput').value;
                ctx.fillStyle = hexToRgba(hexColor, opacity);
                // Hapus pixel lama di titik itu sebelum numpuk warna transparan
                ctx.clearRect(x, y, 1, 1); 
                ctx.fillRect(x, y, 1, 1);
            }
        }

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            // Jika pencet warna, matikan mode eraser
            if(e.button === 0 && !isEraser && document.getElementById('colorInput').value) {
                isEraser = false; 
            }
            drawPixel(e);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDrawing) drawPixel(e);
        });

        canvas.addEventListener('mouseup', () => { isDrawing = false; });
        canvas.addEventListener('mouseleave', () => { isDrawing = false; });

        // Balikin jadi mode gambar kalau ganti warna/opacity
        document.getElementById('colorInput').addEventListener('change', () => isEraser = false);
        document.getElementById('opacityInput').addEventListener('change', () => isEraser = false);

        // --- FUNGSI UTAMA: TEMPLATE SHINE ---
        function loadTemplate() {
            clearCanvas();
            const w = canvas.width;
            const h = canvas.height;
            
            // Loop untuk menggambar garis diagonal miring dari kanan atas ke kiri bawah
            for (let i = 0; i < Math.max(w, h); i++) {
                let x = w - 1 - i; // Mulai dari ujung kanan
                let y = i;         // Mulai dari atas

                if (x >= 0 && x < w && y >= 0 && y < h) {
                    // 1. Garis utama (Putih Solid) - "Gradak" berundak
                    ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
                    ctx.fillRect(x, y, 1, 1);
                    
                    // 2. Shadow tipis di kanannya (Transparan)
                    if(x + 1 < w) {
                        ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
                        ctx.fillRect(x + 1, y, 1, 1);
                    }
                    
                    // 3. Shadow tipis di kirinya (Sangat Transparan)
                    if(x - 1 >= 0) {
                        ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
                        ctx.fillRect(x - 1, y, 1, 1);
                    }
                }
            }
            alert("Template Shine berhasil dimuat! Garisnya diagonal berundak (gradak) dengan shadow tipis.");
        }

        // --- FUNGSI DOWNLOAD ---
        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'custom_shine.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
