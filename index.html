<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eldoria Rank Pixel Generator</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --border-color: #333;
            --accent: #007aff;
            --text-main: #f5f5f7;
            --text-muted: #86868b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }

        h2 {
            grid-column: 1 / -1;
            text-align: center;
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .input-row {
            display: flex;
            gap: 1rem;
        }

        .input-row .input-group { flex: 1; }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input, select {
            padding: 0.75rem;
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
        }

        input[type="color"] {
            padding: 0;
            height: 40px;
            cursor: pointer;
            width: 100%;
        }

        .checkbox-group {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 0.5rem;
            background: #2a2a2a;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .checkbox-group input { width: auto; }

        .preview-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        /* Container preview dibuat relatif untuk menumpuk Grid */
        .canvas-container {
            position: relative;
            width: 100%;
            min-height: 250px;
            background-color: #111;
            /* Pola transparan catur */
            background-image: 
                linear-gradient(45deg, #222 25%, transparent 25%), 
                linear-gradient(-45deg, #222 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #222 75%), 
                linear-gradient(-45deg, transparent 75%, #222 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Canvas utama dibuat pixelated dan diperbesar (Zoom) */
        canvas {
            image-rendering: pixelated; /* Memastikan tidak ada efek blur saat di zoom */
            image-rendering: crisp-edges;
            transform: scale(4); /* Zoom 4x lipat di web agar terlihat jelas */
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        /* Overlay Grid 16x16 */
        .grid-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(4);
            pointer-events: none;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.2) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.2) 1px, transparent 1px);
            background-size: 16px 16px; /* Kotak grid Minecraft (16x16) */
            display: none; /* Sembunyikan default */
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:hover { background-color: #005bb5; }
    </style>
</head>
<body>

<div class="container">
    <h2>Eldoria Rank Pixel Glyph</h2>

    <div class="controls">
        <div class="input-group">
            <label>Template Rank</label>
            <select id="rankPreset">
                <option value="none">-- Pilih Rank Eldoria --</option>
                <option value="NOVARIA" data-color="#B0BEC5" data-bg="#263238">NOVARIA</option>
                <option value="IRONVEIL" data-color="#FFFFFF" data-bg="#607D8B">IRONVEIL</option>
                <option value="SILVERLIGHT" data-color="#E0E0E0" data-bg="#78909C">SILVERLIGHT</option>
                <option value="GOLDHAVEN" data-color="#FFD700" data-bg="#F57F17">GOLDHAVEN</option>
                <option value="PLATINEX" data-color="#81D4FA" data-bg="#0277BD">PLATINEX</option>
                <option value="CRYSTALON" data-color="#CE93D8" data-bg="#6A1B9A">CRYSTALON</option>
                <option value="MYTHORIA" data-color="#FF8A80" data-bg="#AD1457">MYTHORIA</option>
                <option value="ETERNALIS" data-color="#8C9EFF" data-bg="#1565C0">ETERNALIS</option>
                <option value="CELESTORA" data-color="#A7FFEB" data-bg="#00695C">CELESTORA</option>
                <option value="DIVINEXUS" data-color="#FF5252" data-bg="#B71C1C">DIVINEXUS</option>
                <option value="ADMIN" data-color="#FF0000" data-bg="#4A0000">ADMIN</option>
                <option value="OWNER" data-color="#AA0000" data-bg="#2B0000">OWNER</option>
            </select>
        </div>

        <div class="input-group">
            <label>Teks Rank</label>
            <input type="text" id="glyphText" value="NOVARIA">
        </div>

        <div class="input-row">
            <div class="input-group">
                <label>Warna Teks</label>
                <input type="color" id="textColor" value="#B0BEC5">
            </div>
            <div class="input-group">
                <label>Warna Background</label>
                <input type="color" id="bgColor" value="#263238">
            </div>
        </div>

        <div class="input-row">
            <div class="input-group">
                <label>Ukuran Piksel (Lebar)</label>
                <input type="number" id="canvasWidth" value="83">
            </div>
            <div class="input-group">
                <label>Ukuran Piksel (Tinggi)</label>
                <input type="number" id="canvasHeight" value="16">
            </div>
        </div>

        <div class="input-group">
            <label>Upload Icon/Logo (Opsional)</label>
            <input type="file" id="iconUpload" accept="image/png, image/jpeg">
        </div>
    </div>

    <div class="preview-section">
        <div class="checkbox-group" style="width: 100%;">
            <input type="checkbox" id="showGrid">
            <label for="showGrid" style="margin:0; cursor:pointer;">Tampilkan Kotak Grid (16x16)</label>
        </div>

        <div class="canvas-container">
            <canvas id="glyphCanvas"></canvas>
            <div class="grid-overlay" id="gridOverlay"></div>
        </div>
        <p style="font-size: 12px; color: gray; text-align: center;">*Gambar di atas di-zoom 4x lipat. File asli berukuran persis sesuai piksel yang kamu atur agar tidak berat di Minecraft.</p>
        
        <button class="btn" onclick="downloadGlyph()">Download Glyph Asli (.png)</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('glyphCanvas');
    const ctx = canvas.getContext('2d');
    const gridOverlay = document.getElementById('gridOverlay');

    const inputs = {
        preset: document.getElementById('rankPreset'),
        text: document.getElementById('glyphText'),
        textColor: document.getElementById('textColor'),
        bgColor: document.getElementById('bgColor'),
        width: document.getElementById('canvasWidth'),
        height: document.getElementById('canvasHeight'),
        iconUpload: document.getElementById('iconUpload'),
        showGrid: document.getElementById('showGrid')
    };

    let uploadedIcon = null;

    function renderGlyph() {
        const width = parseInt(inputs.width.value) || 83;
        const height = parseInt(inputs.height.value) || 16;
        
        // 1. Atur Ukuran ASLI (Bukan HD)
        canvas.width = width;
        canvas.height = height;

        // 2. Matikan Penghalus Gambar (Biar Pixelated/Minecraft Style)
        ctx.imageSmoothingEnabled = false;

        // Atur ukuran grid overlay sama dengan canvas
        gridOverlay.style.width = width + 'px';
        gridOverlay.style.height = height + 'px';

        ctx.clearRect(0, 0, width, height);

        const text = inputs.text.value;
        const bgColor = inputs.bgColor.value;
        const textColor = inputs.textColor.value;
        
        // Gambar Background Kotak Crisp (Pixelated Border)
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, width, height);
        
        // Border
        ctx.globalAlpha = 1.0;
        ctx.strokeStyle = textColor;
        ctx.lineWidth = 1;
        ctx.strokeRect(0.5, 0.5, width - 1, height - 1);

        // Setup text (Menggunakan font dasar yang tajam)
        const fontSize = Math.floor(height * 0.6); 
        ctx.font = `bold ${fontSize}px monospace`;
        ctx.textBaseline = 'middle';
        ctx.fillStyle = textColor;
        
        // Menentukan posisi icon
        let currentX = Math.floor(width * 0.05); // Padding kiri
        let iconSize = 0;

        if (uploadedIcon) {
            iconSize = Math.floor(height * 0.7);
            const iconY = Math.floor((height - iconSize) / 2);
            ctx.drawImage(uploadedIcon, currentX, iconY, iconSize, iconSize);
            currentX += iconSize + 4; // Gap antara icon dan text
        }

        // Drop shadow untuk teks ala Minecraft
        ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
        ctx.fillText(text, currentX + 1, (height / 2) + 1);
        
        // Teks utama
        ctx.fillStyle = textColor;
        ctx.fillText(text, currentX, height / 2);
    }

    // Toggle Grid Kotak-Kotak 16x16
    inputs.showGrid.addEventListener('change', (e) => {
        gridOverlay.style.display = e.target.checked ? 'block' : 'none';
    });

    // Event Listeners
    inputs.preset.addEventListener('change', (e) => {
        const selected = e.target.options[e.target.selectedIndex];
        if (selected.value !== "none") {
            inputs.text.value = selected.value;
            inputs.textColor.value = selected.getAttribute('data-color');
            inputs.bgColor.value = selected.getAttribute('data-bg');
            renderGlyph();
        }
    });

    [inputs.text, inputs.textColor, inputs.bgColor, inputs.width, inputs.height].forEach(input => {
        input.addEventListener('input', renderGlyph);
    });

    inputs.iconUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    uploadedIcon = img;
                    renderGlyph();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        } else {
            uploadedIcon = null;
            renderGlyph();
        }
    });

    function downloadGlyph() {
        const link = document.createElement('a');
        link.download = `glyph_${inputs.text.value.toLowerCase()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    // Initial render
    renderGlyph();
</script>

</body>
</html>
